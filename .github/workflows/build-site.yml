name: Build Site

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch site data from Apps Script
        run: |
          curl -s -L -X POST "${{ secrets.APPS_SCRIPT_URL }}" \
            -d "action=getSiteData" \
            -o site-data.json
          echo "File size: $(wc -c < site-data.json) bytes"
          head -c 200 site-data.json

      - name: Commit and push
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add site-data.json
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update site data"
            git push
          else
            echo "No changes to commit"
          fi
