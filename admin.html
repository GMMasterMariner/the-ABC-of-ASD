<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - The ABC of ASD</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f5f5;
            color: #333;
        }
        .admin-header {
            background: #194373;
            color: white;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .admin-header h1 { font-size: 1.5rem; }
        .logout-btn {
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            cursor: pointer;
        }
        .logout-btn:hover { background: rgba(255,255,255,0.3); }
        .admin-container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 2rem;
        }
        .section {
            background: white;
            border-radius: 8px;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .section h2 {
            color: #194373;
            margin-bottom: 1.5rem;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 0.5rem;
        }
        .form-group {
            margin-bottom: 1rem;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: #555;
        }
        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 0.8rem;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 1rem;
            font-family: inherit;
        }
        .form-group textarea {
            min-height: 100px;
            resize: vertical;
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }
        .btn {
            background: #f29b2a;
            color: white;
            border: none;
            padding: 0.8rem 1.5rem;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn:hover { background: #e08a1a; }
        .btn-secondary {
            background: #aaa;
        }
        .btn-secondary:hover { background: #888; }
        .btn-danger {
            background: #dc3c33;
        }
        .btn-danger:hover { background: #c53030; }
        .btn-sm {
            padding: 0.4rem 0.8rem;
            font-size: 0.9rem;
        }
        .status-message {
            padding: 1rem;
            border-radius: 6px;
            margin-bottom: 1rem;
            display: none;
        }
        .status-message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .status-message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .data-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }
        .data-table th,
        .data-table td {
            padding: 0.8rem;
            text-align: left;
            border-bottom: 1px solid #eee;
        }
        .data-table th {
            background: #f8f9fa;
            font-weight: 600;
            color: #555;
        }
        .tab-nav {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 2rem;
        }
        .tab-btn {
            padding: 0.6rem 1.2rem;
            border: 1px solid #ddd;
            background: white;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .tab-btn.active {
            background: #194373;
            color: white;
            border-color: #194373;
        }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        #loginScreen {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: #194373;
        }
        .login-box {
            background: white;
            border-radius: 12px;
            padding: 3rem;
            box-shadow: 0 8px 24px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        .login-box h2 {
            color: #194373;
            margin-bottom: 0.5rem;
        }
        .login-box p {
            color: #666;
            margin-bottom: 1.5rem;
        }
        .login-box input {
            width: 100%;
            padding: 0.8rem;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 1.3rem;
            letter-spacing: 4px;
            text-align: center;
            margin-bottom: 1.5rem;
            font-family: inherit;
        }
        #adminPanel { display: none; }
        .loading-spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #194373;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 2rem auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="loginScreen">
        <div class="login-box">
            <h2>Admin Login</h2>
            <p id="loginPrompt">Enter your verification code</p>
            <input type="text" id="codeInput" placeholder="000000" maxlength="6" inputmode="numeric" pattern="[0-9]*" autocomplete="off">
            <button class="btn" id="verifyBtn" style="width:100%;">Verify</button>
            <p id="loginError" style="color:#dc3c33; margin-top:1rem; display:none;"></p>
        </div>
    </div>

    <div id="adminPanel">
        <header class="admin-header">
            <h1>Admin Panel</h1>
            <div>
                <span id="adminNameDisplay" style="margin-right:1rem;"></span>
                <button class="logout-btn" onclick="logout()">Logout</button>
            </div>
        </header>

        <div class="admin-container">
            <div id="statusMessage" class="status-message"></div>

            <div class="tab-nav">
                <button class="tab-btn active" data-tab="tab-settings">Site Settings</button>
                <button class="tab-btn" data-tab="tab-products">Products</button>
                <button class="tab-btn" data-tab="tab-home">Home Page</button>
                <button class="tab-btn" data-tab="tab-about">About</button>
                <button class="tab-btn" data-tab="tab-shipping">Shipping</button>
                <button class="tab-btn" data-tab="tab-legal">Legal</button>
            </div>

            <div class="tab-content active" id="tab-settings">
                <div class="section">
                    <h2>Site Settings</h2>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Primary Color</label>
                            <input type="color" id="primaryColor" value="#194373">
                        </div>
                        <div class="form-group">
                            <label>CTA Color</label>
                            <input type="color" id="ctaColor" value="#f29b2a">
                        </div>
                        <div class="form-group">
                            <label>Secondary Color</label>
                            <input type="color" id="secondaryColor" value="#f29b2a">
                        </div>
                        <div class="form-group">
                            <label>Alert Color</label>
                            <input type="color" id="alertColor" value="#dc3c33">
                        </div>
                        <div class="form-group">
                            <label>Background Color</label>
                            <input type="color" id="backgroundColor" value="#ffffff">
                        </div>
                        <div class="form-group">
                            <label>Text Color</label>
                            <input type="color" id="textColor" value="#000000">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Background Image URL</label>
                        <input type="text" id="backgroundImage" placeholder="https://...">
                    </div>
                    <div class="form-group">
                        <label>Banner Logo URL</label>
                        <input type="text" id="bannerLogo">
                    </div>
                    <div class="form-group">
                        <label>Banner Book Title</label>
                        <input type="text" id="bannerBookTitle">
                    </div>
                    <div class="form-group">
                        <label>Banner Book Title Abbreviation</label>
                        <input type="text" id="bannerBookTitleAbbreviation">
                    </div>
                    <div class="form-group">
                        <label>Banner Book Subtitle</label>
                        <input type="text" id="bannerBookSubtitle">
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Admin 1 Name</label>
                            <input type="text" id="admin1Name">
                        </div>
                        <div class="form-group">
                            <label>Admin 1 Email</label>
                            <input type="email" id="admin1Email">
                        </div>
                        <div class="form-group">
                            <label>Admin 1 Icon URL</label>
                            <input type="text" id="admin1IconURL">
                        </div>
                        <div class="form-group">
                            <label>Admin 2 Name</label>
                            <input type="text" id="admin2Name">
                        </div>
                        <div class="form-group">
                            <label>Admin 2 Email</label>
                            <input type="email" id="admin2Email">
                        </div>
                        <div class="form-group">
                            <label>Admin 2 Icon URL</label>
                            <input type="text" id="admin2IconURL">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Google Maps API Key</label>
                        <input type="text" id="googleMapsApiKey">
                    </div>
                    <button class="btn" onclick="saveSettings()">Save Settings</button>
                </div>
            </div>

            <div class="tab-content" id="tab-products">
                <div class="section">
                    <h2>Product 1</h2>
                    <div class="form-group">
                        <label>Product Name</label>
                        <input type="text" id="product1Name">
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Type (Physical/Digital)</label>
                            <select id="product1Type">
                                <option value="Physical">Physical</option>
                                <option value="Digital">Digital</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Base Price (ZAR)</label>
                            <input type="number" id="product1BasePrice" step="0.01">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Weight (kg)</label>
                            <input type="number" id="product1Weight" step="0.01">
                        </div>
                        <div class="form-group">
                            <label>Image URL</label>
                            <input type="text" id="product1ImageURL">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Discount Threshold</label>
                            <input type="number" id="product1DiscountThreshold">
                        </div>
                        <div class="form-group">
                            <label>Discount Percent</label>
                            <input type="number" id="product1DiscountPercent" step="0.1">
                        </div>
                    </div>
                </div>
                <div class="section">
                    <h2>Product 2</h2>
                    <div class="form-group">
                        <label>Product Name</label>
                        <input type="text" id="product2Name">
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Type (Physical/Digital)</label>
                            <select id="product2Type">
                                <option value="Physical">Physical</option>
                                <option value="Digital">Digital</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Base Price (ZAR)</label>
                            <input type="number" id="product2BasePrice" step="0.01">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Weight (kg)</label>
                            <input type="number" id="product2Weight" step="0.01">
                        </div>
                        <div class="form-group">
                            <label>Image URL</label>
                            <input type="text" id="product2ImageURL">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Discount Threshold</label>
                            <input type="number" id="product2DiscountThreshold">
                        </div>
                        <div class="form-group">
                            <label>Discount Percent</label>
                            <input type="number" id="product2DiscountPercent" step="0.1">
                        </div>
                    </div>
                    <button class="btn" onclick="saveProducts()">Save Products</button>
                </div>
            </div>

            <div class="tab-content" id="tab-home">
                <div class="section">
                    <h2>Home Page Content</h2>
                    <div class="form-group">
                        <label>Home Page Book Headline</label>
                        <input type="text" id="homeHeadline">
                    </div>
                    <div class="form-group">
                        <label>Home Page Book Description 1</label>
                        <textarea id="homeDesc1"></textarea>
                    </div>
                    <div class="form-group">
                        <label>Home Page Book Description 2</label>
                        <textarea id="homeDesc2"></textarea>
                    </div>
                    <div class="form-group">
                        <label>Home Page Item 1 Main Text</label>
                        <input type="text" id="homeItem1Main">
                    </div>
                    <div class="form-group">
                        <label>Home Page Item 1 Sub Text</label>
                        <input type="text" id="homeItem1Sub">
                    </div>
                    <div class="form-group">
                        <label>Home Page Item 2 Main Text</label>
                        <input type="text" id="homeItem2Main">
                    </div>
                    <div class="form-group">
                        <label>Home Page Item 2 Sub Text</label>
                        <input type="text" id="homeItem2Sub">
                    </div>
                    <div class="form-group">
                        <label>Carousel Interval (ms)</label>
                        <input type="number" id="carouselInterval" value="3000">
                    </div>
                    <div class="form-group">
                        <label>Carousel Images (one per line, up to 9)</label>
                        <textarea id="carouselImages" rows="4" placeholder="https://...&#10;https://...&#10;https://..."></textarea>
                    </div>
                    <button class="btn" onclick="saveHomePage()">Save Home Page</button>
                </div>
            </div>

            <div class="tab-content" id="tab-about">
                <div class="section">
                    <h2>About Section</h2>
                    <div class="form-group">
                        <label>Author Image 1 URL</label>
                        <input type="text" id="authorImage1">
                    </div>
                    <div class="form-group">
                        <label>Author Image 2 URL</label>
                        <input type="text" id="authorImage2">
                    </div>
                    <div class="form-group">
                        <label>Author Short Bio</label>
                        <textarea id="authorShortBio" rows="3"></textarea>
                    </div>
                    <div class="form-group">
                        <label>Author Extended Bio</label>
                        <textarea id="authorExtendedBio" rows="6"></textarea>
                    </div>
                    <button class="btn" onclick="saveAbout()">Save About</button>
                </div>
            </div>

            <div class="tab-content" id="tab-shipping">
                <div class="section">
                    <h2>Shipping Regions & Rates</h2>
                    <div id="shippingRegionsList"></div>
                    <button class="btn" onclick="addShippingRegion()" style="margin-top:1rem;">Add Region</button>
                    <button class="btn" onclick="saveShipping()" style="margin-top:1rem; margin-left:0.5rem;">Save All</button>
                </div>
            </div>

            <div class="tab-content" id="tab-legal">
                <div class="section">
                    <h2>Legal Pages</h2>
                    <h3>Privacy Policy</h3>
                    <div class="form-group">
                        <label>Privacy Policy Heading</label>
                        <input type="text" id="privacyHeading">
                    </div>
                    <div class="form-group">
                        <label>Privacy Policy Content</label>
                        <textarea id="privacyContent" rows="8" placeholder="Enter privacy policy text... Use PrivacyPolicyHeading1, PrivacyPolicyContent1, PrivacyPolicyHeading2, PrivacyPolicyContent2 format in the save..."></textarea>
                    </div>
                    <h3>Terms of Service</h3>
                    <div class="form-group">
                        <label>Terms of Service Heading</label>
                        <input type="text" id="termsHeading">
                    </div>
                    <div class="form-group">
                        <label>Terms of Service Content</label>
                        <textarea id="termsContent" rows="8" placeholder="Enter terms of service text..."></textarea>
                    </div>
                    <button class="btn" onclick="saveLegal()">Save Legal</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbytTE9HDnZa8IV38wAYXAYDCdNszha_mV5LOeR3kBZLyqjbaBjdkp791BeaYjh1df2t/exec';
        let adminToken = '';
        let adminNum = '';
        let adminName = '';

        async function loadLoginScreen() {
            const params = new URLSearchParams(window.location.search);
            const token = params.get('token');
            const admin = params.get('admin');

            if (!token || !admin) {
                document.getElementById('loginPrompt').textContent = 'Invalid access. Please login from the main site.';
                document.getElementById('codeInput').style.display = 'none';
                document.getElementById('verifyBtn').style.display = 'none';
                return;
            }

            adminToken = token;
            adminNum = admin;

            try {
                const res = await fetch(API_URL + '?action=getAdminInfo&token=' + token + '&admin=' + admin);
                const data = await res.json();
                
                if (data.result === 'success') {
                    adminName = data.adminName;
                    document.getElementById('loginPrompt').textContent = `Welcome ${adminName}! Enter your verification code`;
                } else {
                    document.getElementById('loginPrompt').textContent = 'Session expired. Please login again.';
                }
            } catch (err) {
                console.error('Failed to load admin info:', err);
                document.getElementById('loginPrompt').textContent = 'Error loading. Please try again.';
            }
        }

        document.getElementById('verifyBtn').addEventListener('click', async () => {
            const code = document.getElementById('codeInput').value.trim();
            if (!code || code.length !== 6) {
                document.getElementById('loginError').textContent = 'Please enter a 6-digit code.';
                document.getElementById('loginError').style.display = 'block';
                return;
            }

            try {
                const params = new URLSearchParams();
                params.append('action', 'verifyAdminCode');
                params.append('admin', adminNum);
                params.append('code', code);
                const res = await fetch(API_URL, { method: 'POST', body: params });
                const data = await res.json();

                if (data.result === 'success') {
                    document.getElementById('loginScreen').style.display = 'none';
                    document.getElementById('adminPanel').style.display = 'block';
                    document.getElementById('adminNameDisplay').textContent = adminName || 'Admin';
                    loadAllData();
                } else {
                    document.getElementById('loginError').textContent = data.message || 'Invalid code.';
                    document.getElementById('loginError').style.display = 'block';
                }
            } catch (err) {
                document.getElementById('loginError').textContent = 'Network error. Please try again.';
                document.getElementById('loginError').style.display = 'block';
            }
        });

        document.getElementById('codeInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') document.getElementById('verifyBtn').click();
        });

        function logout() {
            adminToken = '';
            adminNum = '';
            document.getElementById('adminPanel').style.display = 'none';
            document.getElementById('loginScreen').style.display = 'flex';
            document.getElementById('codeInput').value = '';
            document.getElementById('loginError').style.display = 'none';
            window.history.pushState({}, '', 'admin.html');
        }

        function showStatus(message, type) {
            const statusEl = document.getElementById('statusMessage');
            statusEl.textContent = message;
            statusEl.className = 'status-message ' + type;
            statusEl.style.display = 'block';
            setTimeout(() => { statusEl.style.display = 'none'; }, 3000);
        }

        async function loadAllData() {
            try {
                const res = await fetch(API_URL + '?action=getAllAdminData&token=' + adminToken + '&admin=' + adminNum);
                const data = await res.json();
                
                if (data.result === 'success') {
                    populateSettings(data.settings || {});
                    populateProducts(data.products || []);
                    populateHome(data.home || {});
                    populateAbout(data.about || {});
                    populateShipping(data.shippingRegions || [], data.regionRates || []);
                    populateLegal(data.legal || {});
                } else {
                    showStatus('Failed to load data', 'error');
                }
            } catch (err) {
                console.error('Failed to load data:', err);
                showStatus('Error loading data', 'error');
            }
        }

        function populateSettings(settings) {
            document.getElementById('primaryColor').value = settings.PrimaryColor || '#194373';
            document.getElementById('ctaColor').value = settings.CTAColor || '#f29b2a';
            document.getElementById('secondaryColor').value = settings.SecondaryColor || '#f29b2a';
            document.getElementById('alertColor').value = settings.AlertColour || '#dc3c33';
            document.getElementById('backgroundColor').value = settings.BackgroundColor || '#ffffff';
            document.getElementById('textColor').value = settings.TextColor || '#000000';
            document.getElementById('backgroundImage').value = settings.BackgroundImage || '';
            document.getElementById('bannerLogo').value = settings.BannerLogo || '';
            document.getElementById('bannerBookTitle').value = settings.BannerBookTitle || '';
            document.getElementById('bannerBookTitleAbbreviation').value = settings.BannerBookTitleAbbreviation || '';
            document.getElementById('bannerBookSubtitle').value = settings.BannerBookSubTitile || '';
            document.getElementById('admin1Name').value = settings.Admin1Name || '';
            document.getElementById('admin1Email').value = settings.Admin1Email || '';
            document.getElementById('admin1IconURL').value = settings.Admin1IconURL || '';
            document.getElementById('admin2Name').value = settings.Admin2Name || '';
            document.getElementById('admin2Email').value = settings.Admin2Email || '';
            document.getElementById('admin2IconURL').value = settings.Admin2IconURL || '';
            document.getElementById('googleMapsApiKey').value = settings.GoogleMapsApiKey || '';
        }

        function populateProducts(products) {
            if (products[0]) {
                document.getElementById('product1Name').value = products[0].ProductName || '';
                document.getElementById('product1Type').value = products[0].Type || 'Physical';
                document.getElementById('product1BasePrice').value = products[0].BasePrice || '';
                document.getElementById('product1Weight').value = products[0].Weight || '';
                document.getElementById('product1ImageURL').value = products[0].ImageURL || '';
                document.getElementById('product1DiscountThreshold').value = products[0].DiscountThreshold || '';
                document.getElementById('product1DiscountPercent').value = products[0].DiscountPercent || '';
            }
            if (products[1]) {
                document.getElementById('product2Name').value = products[1].ProductName || '';
                document.getElementById('product2Type').value = products[1].Type || 'Physical';
                document.getElementById('product2BasePrice').value = products[1].BasePrice || '';
                document.getElementById('product2Weight').value = products[1].Weight || '';
                document.getElementById('product2ImageURL').value = products[1].ImageURL || '';
                document.getElementById('product2DiscountThreshold').value = products[1].DiscountThreshold || '';
                document.getElementById('product2DiscountPercent').value = products[1].DiscountPercent || '';
            }
        }

        function populateHome(home) {
            document.getElementById('homeHeadline').value = home.HomePageBookHeadline || '';
            document.getElementById('homeDesc1').value = home.HomePageBookDescription1 || '';
            document.getElementById('homeDesc2').value = home.HomePageBookDescription2 || '';
            document.getElementById('homeItem1Main').value = home.HomePageItem1MainText || '';
            document.getElementById('homeItem1Sub').value = home.HomePageItem1SubText || '';
            document.getElementById('homeItem2Main').value = home.HomePageItem2MainText || '';
            document.getElementById('homeItem2Sub').value = home.HomePageItem2SubText || '';
            document.getElementById('carouselInterval').value = home.HomePageCarouselInterval || '3000';
            
            let carouselUrls = [];
            for (let i = 1; i <= 9; i++) {
                const url = home['HomePageCarouselImage' + i];
                if (url) carouselUrls.push(url);
            }
            document.getElementById('carouselImages').value = carouselUrls.join('\n');
        }

        function populateAbout(about) {
            document.getElementById('authorImage1').value = about.AuthorImage1URL || '';
            document.getElementById('authorImage2').value = about.AuthorImage2URL || '';
            document.getElementById('authorShortBio').value = about.AuthorShortBio || '';
            document.getElementById('authorExtendedBio').value = about.AuthorExtendedBio || '';
        }

        function populateShipping(regions, rates) {
            const container = document.getElementById('shippingRegionsList');
            container.innerHTML = '';
            
            const allLocations = [...new Set([...regions.map(r => r.Location), ...rates.map(r => r.Location)])];
            
            allLocations.forEach((loc, index) => {
                const region = regions.find(r => r.Location === loc) || {};
                const regionRates = rates.filter(r => r.Location === loc);
                
                const div = document.createElement('div');
                div.className = 'section';
                div.style.marginBottom = '1rem';
                div.innerHTML = `

        function populateLegal(legal) {
            const privacyKeys = Object.keys(legal).filter(k => k.toLowerCase().startsWith('privacy'));
            const termsKeys = Object.keys(legal).filter(k => k.toLowerCase().startsWith('terms'));
            
            document.getElementById('privacyHeading').value = legal[privacyKeys.find(k => k.endsWith('Heading'))] || '';
            document.getElementById('privacyContent').value = privacyKeys
                .filter(k => !k.endsWith('Heading'))
                .map(k => k + ': ' + legal[k])
                .join('\n\n');
            
            document.getElementById('termsHeading').value = legal[termsKeys.find(k => k.endsWith('Heading'))] || '';
            document.getElementById('termsContent').value = termsKeys
                .filter(k => !k.endsWith('Heading'))
                .map(k => k + ': ' + legal[k])
                .join('\n\n');
        }

        async function saveShipping() {
            const regions = [];
            const rates = [];
            
            document.querySelectorAll('#shippingRegionsList .section').forEach(section => {
                const location = section.querySelector('.region-location').value.trim();
                if (!location) return;
                
                regions.push({
                    Location: location,
                    Region: section.querySelector('.region-code').value.trim(),
                    FlagURL: section.querySelector('.region-flag').value.trim(),
                    PhoneCode: section.querySelector('.region-phone').value.trim()
                });
                
                section.querySelectorAll('.rate-row').forEach(row => {
                    rates.push({
                        Location: location,
                        MaxWeight: parseFloat(row.querySelector('.rate-maxweight').value) || 0,
                        Cost: parseFloat(row.querySelector('.rate-cost').value) || 0,
                        Time: row.querySelector('.rate-time').value.trim()
                    });
                });
            });

            const params = new URLSearchParams();
            params.append('action', 'saveShipping');
            params.append('token', adminToken);
            params.append('admin', adminNum);
            params.append('regions', JSON.stringify(regions));
            params.append('rates', JSON.stringify(rates));

            try {
                const res = await fetch(API_URL, { method: 'POST', body: params });
                const data = await res.json();
                showStatus(data.result === 'success' ? 'Shipping saved!' : 'Failed to save', data.result === 'success' ? 'success' : 'error');
            } catch (err) {
                showStatus('Error saving shipping', 'error');
            }
        }

        async function saveLegal() {
            const legal = {};
            
            const privacyHeading = document.getElementById('privacyHeading').value.trim();
            if (privacyHeading) legal['PrivacyPolicyHeading'] = privacyHeading;
            
            const privacyContent = document.getElementById('privacyContent').value.trim();
            if (privacyContent) {
                const lines = privacyContent.split('\n\n');
                lines.forEach((line, i) => {
                    const colonIndex = line.indexOf(':');
                    if (colonIndex > 0) {
                        const key = line.substring(0, colonIndex).trim();
                        const value = line.substring(colonIndex + 1).trim();
                        legal[key] = value;
                    } else {
                        legal['PrivacyPolicyContent' + (i + 1)] = line;
                    }
                });
            }
            
            const termsHeading = document.getElementById('termsHeading').value.trim();
            if (termsHeading) legal['TermsHeading'] = termsHeading;
            
            const termsContent = document.getElementById('termsContent').value.trim();
            if (termsContent) {
                const lines = termsContent.split('\n\n');
                lines.forEach((line, i) => {
                    const colonIndex = line.indexOf(':');
                    if (colonIndex > 0) {
                        const key = line.substring(0, colonIndex).trim();
                        const value = line.substring(colonIndex + 1).trim();
                        legal[key] = value;
                    } else {
                        legal['TermsContent' + (i + 1)] = line;
                    }
                });
            }

            const params = new URLSearchParams();
            params.append('action', 'saveLegal');
            params.append('token', adminToken);
            params.append('admin', adminNum);
            params.append('data', JSON.stringify(legal));

            try {
                const res = await fetch(API_URL, { method: 'POST', body: params });
                const data = await res.json();
                showStatus(data.result === 'success' ? 'Legal saved!' : 'Failed to save', data.result === 'success' ? 'success' : 'error');
            } catch (err) {
                showStatus('Error saving legal', 'error');
            }
        }

            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                btn.classList.add('active');
                document.getElementById(btn.dataset.tab).classList.add('active');
            });
        });

        loadLoginScreen();
