<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Dynamic Website</title>
    <style>
        /* We'll set colors dynamically later, but here's a fallback base */
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .banner {
            text-align: center;
            padding: 2rem 1rem;
        }
        .banner img.logo {
            max-height: 80px;
        }
        .banner h1 {
            margin: 0.5rem 0;
        }
        .banner h2 {
            font-weight: normal;
        }
        .nav-icons {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 1rem;
            background: rgba(0,0,0,0.05);
        }
        .nav-icons a img {
            height: 40px;
        }
        .content {
            padding: 2rem;
        }
    </style>
</head>
<body>
    <!-- Banner Section -->
    <div class="banner" id="banner">
        <img class="logo" id="bannerLogo" src="" alt="Logo">
        <h1 id="bannerTitle"></h1>
        <h2 id="bannerSubtitle"></h2>
    </div>

    <!-- Navigation Icons -->
    <div class="nav-icons" id="navIcons"></div>

    <!-- Main Content (placeholder for now) -->
    <div class="content">
        <p>Welcome! This page is styled live from your Google Sheet.</p>
    </div>

    <script>
        // ==============================================
        // 🔧 REPLACE THIS URL WITH YOUR WEB APP URL
        // ==============================================
        const API_URL = 'https://script.google.com/macros/s/AKfycbwYyqg5oWjfGuZkBH96GO_htc8ljiI3os3RGbqh2cWJPGkB3efyAnTRkkQex4Cn2c7j/exec';

        // Helper: extract settings into a simple object like { Setting: Value }
        async function fetchSettings() {
            const response = await fetch(API_URL);
            const data = await response.json();
            const settings = {};
            data.forEach(item => {
                settings[item.Setting] = item.Value;
            });
            return settings;
        }

        // Apply the settings to the page
        async function applySettings() {
            const s = await fetchSettings();

            // --- Colors ---
            document.body.style.backgroundColor = s.BackgroundColor || '#ffffff';
            document.body.style.color = s.TextColor || '#000000';
            // If you have a banner/nav bar color, you can set it similarly:
            // e.g., document.getElementById('banner').style.backgroundColor = s.PrimaryColor;

            // --- Banner Logo ---
            const bannerLogo = document.getElementById('bannerLogo');
            if (s.LogoURL) {
                bannerLogo.src = s.LogoURL;
                bannerLogo.style.display = 'block';
            } else {
                bannerLogo.style.display = 'none';
            }

            // --- Banner Text ---
            document.getElementById('bannerTitle').textContent = s.BannerBookTitle || '';
            document.getElementById('bannerSubtitle').textContent = s.BannerBookSubTitile || '';

            // --- Navigation Icons (Home, Order, About, Contact, LinkedIn) ---
            const navContainer = document.getElementById('navIcons');
            navContainer.innerHTML = ''; // clear

            const navItems = [
                { setting: 'NavIconURLHome', textSetting: 'HomePageTitle', href: '#' },
                { setting: 'NavIconURLOrder', textSetting: 'OrderPageTitle', href: '#' },
                { setting: 'NavIconURLAbout', textSetting: 'AboutPageTitle', href: '#' },
                { setting: 'NavIconURLContact', textSetting: 'ContactPageTitle', href: '#' },
                { setting: 'NavIconURLLinkedIn', textSetting: null, href: '#', external: true }
            ];

            navItems.forEach(item => {
                const url = s[item.setting];
                if (url && url.trim() !== '') {
                    const a = document.createElement('a');
                    a.href = item.href;
                    if (item.external) a.target = '_blank';
                    const img = document.createElement('img');
                    img.src = url;
                    img.alt = item.setting.replace('NavIconURL', '');
                    a.appendChild(img);
                    navContainer.appendChild(a);
                }
            });
        }

        // Run when page loads
        applySettings().catch(err => console.error('Error applying settings:', err));
    </script>
</body>
</html>
