<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The ABC of ASD</title>

    <!-- Google Font: Nunito Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Nunito Sans', sans-serif;
            background-color: #ffffff;
            color: #000000;
            padding-top: 108px;
        }

        /* ---------- STICKY HEADER ---------- */
        .sticky-header {
            position: fixed;
            top: 0; left: 0; width: 100%;
            z-index: 1000;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .banner {
            position: relative;
            background-color: #194373;
            color: #ffffff;
            padding: 0.8rem 1.2rem;
            min-height: 60px;
        }
        .banner-logo {
            position: absolute;
            left: 1.2rem; top: 50%;
            transform: translateY(-50%);
            z-index: 2;
        }
        .banner-logo img { max-height: 45px; display: block; }

        .banner-text { width: 100%; text-align: center; }
        .banner-text h1 { font-size: 1.4rem; font-weight: 700; line-height: 1.2; margin: 0; }
        .banner-text h1 .abbreviation { font-weight: 200; opacity: 0.95; letter-spacing: -0.3px; }
        .banner-text h2 {
            font-size: 1.2rem; letter-spacing: 0.4px; font-weight: 400;
            line-height: 1.3; margin: 0.25rem 0 0 0; opacity: 0.9;
        }

        .navbar {
            position: relative;
            display: flex; align-items: center;
            justify-content: space-between;
            background-color: #ffffff;
            padding: 0.5rem 1.2rem;
            border-top: 1px solid rgba(0,0,0,0.05);
            min-height: 48px;
        }
        .hamburger {
            display: none;
            background: none; border: none;
            font-size: 1.5rem; line-height: 1;
            cursor: pointer; padding: 0.2rem;
            margin-right: 1rem; z-index: 3;
            color: #194373;
        }
        .nav-left { display: flex; align-items: center; gap: 1.2rem; z-index: 2; }
        .nav-left a { display: inline-flex; align-items: center; text-decoration: none; color: #194373; }
        .nav-left a img { height: 30px; transition: transform 0.2s ease; }
        .nav-left a:hover img { transform: scale(1.15); }
        .nav-label { display: none; }

        .nav-center {
            position: absolute; left: 50%; transform: translateX(-50%);
            font-size: 1.1rem; font-weight: 600;
            color: #194373; white-space: nowrap;
            pointer-events: none; z-index: 1;
        }

        /* Currency selector */
        .nav-right { display: flex; align-items: center; z-index: 2; gap: 0.4rem; }
        .currency-label {
            font-size: 0.9rem;
            font-weight: 500;
            color: #194373;
        }
        .currency-btn {
            display: flex; align-items: center;
            gap: 0.4rem;
            background: #f0f0f0;
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 0.3rem 0.5rem;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            color: #194373;
            position: relative;
        }
        .currency-btn img { height: 20px; width: auto; }
        .currency-dropdown {
            position: absolute;
            top: 100%; right: 0;
            background: white;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            z-index: 20;
            display: none;
            min-width: 160px;
            max-height: 200px;
            overflow-y: auto;
        }
        .currency-dropdown.open { display: block; }
        .currency-dropdown-item {
            display: flex; align-items: center;
            gap: 0.5rem;
            padding: 0.4rem 0.8rem;
            cursor: pointer;
            white-space: nowrap;
            font-size: 0.9rem;
        }
        .currency-dropdown-item:hover { background: #f0f0f0; }
        .currency-dropdown-item img { height: 20px; width: auto; }

        /* ---------- MAIN CONTENT ---------- */
        .content { padding: 2rem; max-width: 1200px; margin: 0 auto; }
        .page-section { display: none; }
        .page-section.active { display: block; padding-top: 0.5rem; }

        /* ---- Home Page ---- */
        .home-headline { /* ... */ }

        .home-columns { /* ... */ }
        .home-col { /* ... */ }
        .home-col-left-box { /* ... */ }
        .home-col-left-box h3 { /* ... */ }
        .home-col-left-box p { /* ... */ }

        .carousel-wrapper { /* ... */ }
        .carousel-track { /* ... */ }
        .carousel-slide { /* ... */ }
        .carousel-slide img { /* ... */ }
        .carousel-arrow { /* ... */ }
        .carousel-arrow.prev { /* ... */ }
        .carousel-arrow.next { /* ... */ }
        .carousel-dots { /* ... */ }
        .carousel-dot { /* ... */ }
        .carousel-dot.active { /* ... */ }

        .product-card { /* ... */ }
        .product-card h4 { /* ... */ }
        .product-card .sub { /* ... */ }
        .product-card .price { /* ... */ }

        .central-order-btn { /* ... */ }
        .btn { /* ... */ }

        /* ---- About Section ---- */
        .about-img-1 { /* ... */ }
        .about-img-2 { /* ... */ }
        .about-text { /* ... */ }
        .bio-toggle { /* ... */ }
        .bio-extended { /* ... */ }

        /* ---- Contact Form ---- */
        .contact-form { /* ... */ }
        .form-row { /* ... */ }
        .form-row .form-group { /* ... */ }
        .form-group { /* ... */ }
        .contact-form label { /* ... */ }
        .contact-form input,
        .contact-form textarea { /* ... */ }
        .contact-form textarea { /* ... */ }
        .contact-form .btn-wrapper { /* ... */ }
        .contact-form button { /* ... */ }
        .contact-result { /* ... */ }

        /* ---- Order Form (new layout) ---- */
        .order-wrapper {
            max-width: 900px;
            margin: 0 auto;
        }

        /* Product Selection Box */
        .order-product-box {
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 2rem;
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 2rem;
        }
        .order-product-option {
            flex: 1;
            text-align: center;
            padding: 1rem;
            border: 2px solid transparent;
            border-radius: 8px;
            cursor: pointer;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .order-product-option.selected {
            border-color: var(--alert-color, #dc3c33);
            box-shadow: 0 0 12px rgba(220, 60, 51, 0.3);
        }
        .order-product-option img {
            max-height: 100px;
            margin-bottom: 0.5rem;
        }
        .order-product-option h4 {
            font-size: 1rem;
            margin-bottom: 0.5rem;
        }
        .order-product-option .product-price {
            font-weight: 700;
            font-size: 1.2rem;
            color: var(--alert-color, #dc3c33);
        }
        .order-quantity-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 0 0 auto;
        }
        .order-quantity-center label {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }
        .order-quantity-center input {
            width: 100px;
            padding: 1rem;
            font-size: 1.5rem;
            text-align: center;
            border: 1px solid #ccc;
            border-radius: 8px;
        }
        .order-quantity-total {
            margin-top: 1rem;
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--alert-color, #dc3c33);
        }

        /* Email + verify */
        .order-email-row {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        .order-email-row input {
            flex: 1;
            padding: 0.7rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1rem;
        }
        .order-email-row .btn {
            flex: 1;
            padding: 0.7rem;
            font-size: 1rem;
            text-align: center;
        }

        /* Name & Phone side-by-side */
        .order-name-phone {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        .order-name-phone input {
            flex: 1;
            padding: 0.7rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1rem;
        }

        /* Shipping address fields */
        .order-address-fields {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-top: 1rem;
        }
        .order-address-fields input,
        .order-address-fields .country-select {
            padding: 0.7rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1rem;
        }
        .address-field-full {
            grid-column: span 2;
        }
        .address-autocomplete-wrapper {
            position: relative;
        }
        .locate-btn {
            position: absolute;
            right: 0.5rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
        }

        /* Summary + Payment row */
        .order-bottom-row {
            display: flex;
            gap: 2rem;
            margin-top: 2rem;
            align-items: flex-start;
        }
        .order-summary {
            flex: 2;
            background: #f9f9f9;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 1.5rem;
        }
        .order-summary h4 { margin-bottom: 1rem; }
        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.5rem;
        }
        .summary-row.total {
            font-weight: 700;
            font-size: 1.1rem;
            border-top: 1px solid #ddd;
            padding-top: 0.5rem;
            margin-top: 0.5rem;
        }
        .discount-text {
            color: var(--alert-color, #dc3c33);
            font-size: 0.9rem;
            margin-left: 0.5rem;
        }
        .order-payment {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .pay-btn {
            background: #f0f0f0;
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .pay-btn img {
            height: 30px;
        }
        .pay-btn:hover {
            background: #e0e0e0;
        }

        /* Responsive (basic) */
        @media (max-width: 768px) {
            .order-product-box {
                flex-direction: column;
                gap: 1rem;
            }
            .order-quantity-center {
                order: -1;
            }
            .order-email-row,
            .order-name-phone {
                flex-direction: column;
            }
            .order-bottom-row {
                flex-direction: column;
            }
            .order-address-fields {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- ================== STICKY HEADER (same as before) ================== -->
    <div class="sticky-header" id="stickyHeader">
        <div class="banner" id="banner">
            <div class="banner-logo">
                <img id="bannerLogo" src="" alt="Logo">
            </div>
            <div class="banner-text">
                <h1 id="bannerTitle"></h1>
                <h2 id="bannerSubtitle"></h2>
            </div>
        </div>

        <nav class="navbar" id="navbar">
            <button class="hamburger" id="hamburgerBtn" aria-label="Menu" aria-expanded="false">☰</button>
            <div class="nav-left" id="navIcons"></div>
            <div class="nav-center" id="pageTitleDisplay"></div>
            <div class="nav-right" id="currencySelectorContainer">
                <span class="currency-label">Currency:</span>
            </div>
        </nav>
    </div>

    <!-- ================== PAGE SECTIONS ================== -->
    <div class="content">
        <!-- Home (unchanged) -->
        <div class="page-section active" id="home-section">
            <h2 class="home-headline" id="homeHeadline"></h2>
            <div class="home-columns">
                <div class="home-col home-col-left">
                    <div class="home-col-left-box" id="leftBox">
                        <h3 id="homeDesc1"></h3>
                        <p id="homeDesc2"></p>
                    </div>
                </div>
                <div class="home-col home-col-center">
                    <div class="carousel-container" id="carouselContainer">
                        <div class="carousel-wrapper" id="carouselWrapper">
                            <div class="carousel-track" id="carouselTrack"></div>
                            <button class="carousel-arrow prev" id="prevBtn" aria-label="Previous">‹</button>
                            <button class="carousel-arrow next" id="nextBtn" aria-label="Next">›</button>

                </div>
                <div class="home-col home-col-right" id="productCardsColumn"></div>

        <!-- About (unchanged) -->

        <!-- Order (new design) -->
        <div class="page-section" id="order-section">
            <div class="order-wrapper">
                <!-- Product Selection Box with Quantity -->
                <div class="order-product-box" id="productSelectionBox">
                    <!-- Left product option (will be populated by JS) -->

                    <!-- Center quantity -->

                    <!-- Shipping Address Fields (only for physical) -->
                    <div class="order-shipping-address" id="shippingAddressSection" style="display: none;">

    <script>
        // ==============================================
        // 🔧 REPLACE WITH YOUR WEB APP URL
        // ==============================================
        const API_URL = 'https://script.google.com/macros/s/AKfycbzVsq1fwKZ59_j2ZUJmjxrILB74_yUCz-kAi8XNd4xKfDQBGAdVMdurw8sb-WC0rdXW/exec';

        // ---------- GLOBAL STATE ----------
        let appSettings = {};
        let exchangeRates = [];
        let selectedCurrency = null;
        let products = [];
        let aboutData = {};
        let carouselIntervalId = null;
        let shippingRegions = [];
        let regionRates = [];
        let selectedProduct = null;
        let userCountryRegion = null;

        // ---------- SINGLE FETCH FOR ALL DATA ----------
        async function fetchAllSiteData() {
            const res = await fetch(API_URL + '?combined=true');
            return await res.json();
        }

        // ---------- CURRENCY FUNCTIONS (same) ----------
        function buildCurrencySelector() { /* ... unchanged ... */ }
        function updateCurrencyDisplay() { /* ... */ }
        async function detectUserCurrency() { /* ... */ }
        function convertPrice(zarAmount) { /* ... */ }
        function formatPrice(zarAmount) {
            const converted = convertPrice(zarAmount);
            const code = selectedCurrency ? selectedCurrency.CurrencyCode : 'ZAR';
            const formattedNumber = converted.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            const symbol = (selectedCurrency && selectedCurrency.Symbol) ? selectedCurrency.Symbol : code;
            return symbol + ' ' + formattedNumber;
        }
        function refreshAllPrices() { /* ... */ }

        // ---------- HEIGHT EQUALISATION (same) ----------
        function equalizeHeights() { /* ... */ }

        // ---------- CAROUSEL (same) ----------
        function buildCarousel(imageUrls, interval) { /* ... */ }

        // ---------- DIRECT DATA LOADERS (slightly modified) ----------
        function applySettingsDirect(settings) {
            // same as before, but also set payment logos
            document.body.style.backgroundColor = settings.BackgroundColor || '#ffffff';
            document.body.style.color = settings.TextColor || '#000000';
            document.getElementById('banner').style.backgroundColor = settings.PrimaryColor || '#194373';
            document.documentElement.style.setProperty('--cta-color', settings.CTAColor || '#f29b2a');
            document.documentElement.style.setProperty('--primary-color', settings.PrimaryColor || '#194373');
            document.documentElement.style.setProperty('--alert-color', settings.AlertColour || '#dc3c33');

            const logo = document.getElementById('bannerLogo');
            if (settings.BannerLogo) {
                logo.src = settings.BannerLogo;
                logo.style.display = 'block';
            } else {
                logo.style.display = 'none';
            }

            const titleEl = document.getElementById('bannerTitle');
            const mainTitle = settings.BannerBookTitle || '';
            const abbrev = settings.BannerBookTitleAbbreviation || '';
            if (mainTitle && abbrev) {
                titleEl.innerHTML = `${mainTitle} <span class="abbreviation">${abbrev}</span>`;
            } else if (mainTitle) {
                titleEl.textContent = mainTitle;
            } else {
                titleEl.textContent = '';
            }
            document.getElementById('bannerSubtitle').textContent = settings.BannerBookSubTitile || '';

            // Payment logos
            if (settings.PayPalLogo) {
                document.getElementById('paypalLogoImg').src = settings.PayPalLogo;
            }
            if (settings.PayfastLogo) {
                document.getElementById('payfastLogoImg').src = settings.PayfastLogo;
            }

            // Navigation icons (unchanged)
            const navContainer = document.getElementById('navIcons');
            navContainer.innerHTML = '';
            const navItems = [
                { iconSetting: 'NavIconURLHome', section: 'home-section', label: 'Home' },
                { iconSetting: 'NavIconURLOrder', section: 'order-section', label: 'Order' },
                { iconSetting: 'NavIconURLAbout', section: 'about-section', label: 'About' },
                { iconSetting: 'NavIconURLContact', section: 'contact-section', label: 'Contact' },
                { iconSetting: 'NavIconURLLinkedIn', externalLinkSetting: 'LinkedInURL', label: 'LinkedIn' }
            ];
            navItems.forEach(item => {
                const iconUrl = settings[item.iconSetting];
                if (!iconUrl || iconUrl.trim() === '') return;
                const a = document.createElement('a');
                a.title = item.label;
                if (item.externalLinkSetting) {
                    let linkUrl = settings[item.externalLinkSetting];
                    if (linkUrl && linkUrl.trim() !== '') {
                        if (!/^https?:\/\//i.test(linkUrl)) linkUrl = 'https://' + linkUrl;
                        a.href = linkUrl;
                        a.target = '_blank';
                    } else { return; }
                } else if (item.section) {
                    a.href = '#';
                    a.dataset.section = item.section;
                }
                const img = document.createElement('img');
                img.src = iconUrl;
                img.alt = item.label;
                a.appendChild(img);
                const span = document.createElement('span');
                span.className = 'nav-label';
                span.textContent = item.label;
                a.appendChild(span);
                navContainer.appendChild(a);
            });
            navContainer.addEventListener('click', (e) => {
                const link = e.target.closest('a');
                if (!link || link.target === '_blank') return;
                e.preventDefault();
                const section = link.dataset.section;
                if (section) showPage(section);
            });

            updateNavTitle('home-section');
        }

        function loadHomePageDirect(home) { /* ... unchanged ... */ }

        function loadAboutSectionDirect(about) { /* ... unchanged ... */ }

        // ---------- ORDER PAGE LOGIC ----------
        function loadOrderPage() {
            const container1 = document.getElementById('productOption1');
            const container2 = document.getElementById('productOption2');
            if (products.length < 2) return;

            // Populate product 1
            const prod1 = products[0];
            container1.innerHTML = `
                <img src="${prod1.ImageURL}" alt="${prod1.ProductName}">
                <h4>${prod1.ProductName}</h4>
                <p class="product-price" data-zar="${prod1.BasePrice}">${formatPrice(prod1.BasePrice)}</p>
            `;
            container1.addEventListener('click', () => selectProduct(0));

            // Populate product 2
            const prod2 = products[1];
            container2.innerHTML = `
                <img src="${prod2.ImageURL}" alt="${prod2.ProductName}">
                <h4>${prod2.ProductName}</h4>
                <p class="product-price" data-zar="${prod2.BasePrice}">${formatPrice(prod2.BasePrice)}</p>
            `;
            container2.addEventListener('click', () => selectProduct(1));

            // Default select first product
            selectProduct(0);

            // Quantity input
            document.getElementById('orderQuantity').addEventListener('input', () => {
                updateQuantityTotal();
                updateOrderSummary();
            });

            // Email verify
            document.getElementById('verifyEmailBtn').addEventListener('click', () => {
                const email = document.getElementById('orderEmail').value.trim();
                if (!email) { alert('Please enter an email address.'); return; }
                document.getElementById('customerDetails').style.display = 'block';
                if (selectedProduct && selectedProduct.ype === 'Physical') {
                    document.getElementById('shippingAddressSection').style.display = 'block';
                    // Load Google Maps if not already
                    if (appSettings.GoogleMapsApiKey && !window.google) {
                        loadGoogleMapsScript(appSettings.GoogleMapsApiKey);
                    }
                } else {
                    document.getElementById('shippingAddressSection').style.display = 'none';
                }
                document.getElementById('verifyEmailBtn').textContent = 'Verified ✅';
                document.getElementById('verifyEmailBtn').disabled = true;
                updateOrderSummary();
            });

            // Locate button
            document.getElementById('locateBtn').addEventListener('click', () => {
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(async (pos) => {
                        const { latitude, longitude } = pos.coords;
                        if (window.google && google.maps) {
                            const geocoder = new google.maps.Geocoder();
                            const latlng = new google.maps.LatLng(latitude, longitude);
                            geocoder.geocode({ location: latlng }, (results, status) => {
                                if (status === 'OK' && results[0]) {
                                    fillAddressFromPlace(results[0]);
                                }
                            });
                        } else {
                            alert('Geolocation service unavailable.');
                        }
                    }, () => alert('Unable to retrieve location.'));
                } else {
                    alert('Geolocation not supported.');
                }
            });

            // Populate country dropdown from shipping regions
            const countrySelect = document.getElementById('addressCountry');
            shippingRegions.forEach(region => {
                const option = document.createElement('option');
                option.value = region.Location;
                option.textContent = region.Location;
                countrySelect.appendChild(option);
            });

            updateQuantityTotal();
            updateOrderSummary();
        }

        function selectProduct(index) {
            const opt1 = document.getElementById('productOption1');
            const opt2 = document.getElementById('productOption2');
            opt1.classList.remove('selected');
            opt2.classList.remove('selected');
            if (index === 0) {
                opt1.classList.add('selected');
                selectedProduct = products[0];
            } else {
                opt2.classList.add('selected');
                selectedProduct = products[1];
            }
            // Update quantity total and summary
            updateQuantityTotal();
            updateOrderSummary();
            // If email verified, toggle shipping visibility
            const isVerified = document.getElementById('verifyEmailBtn').disabled;
            if (isVerified) {
                if (selectedProduct.ype === 'Physical') {
                    document.getElementById('shippingAddressSection').style.display = 'block';
                } else {
                    document.getElementById('shippingAddressSection').style.display = 'none';
                }
            }
        }

        function updateQuantityTotal() {
            if (!selectedProduct) return;
            const qty = parseInt(document.getElementById('orderQuantity').value) || 1;
            const unitPrice = selectedProduct.BasePrice;
            const total = unitPrice * qty;
            document.getElementById('quantityTotalPrice').textContent = formatPrice(total);
        }

        function getUnitPrice() {
            if (!selectedProduct) return 0;
            const qty = parseInt(document.getElementById('orderQuantity').value) || 1;
            const threshold = selectedProduct.DiscountThreshold || 0;
            const discountPercent = selectedProduct.DiscountPercent || 0;
            if (qty >= threshold) {
                return selectedProduct.BasePrice * (1 - discountPercent / 100);
            }
            return selectedProduct.BasePrice;
        }

        function getShippingCost() {
            if (!selectedProduct || selectedProduct.ype === 'Digital') return 0;
            if (!userCountryRegion) return 0;
            const qty = parseInt(document.getElementById('orderQuantity').value) || 1;
            const totalWeight = selectedProduct.Weight * qty;
            const regionRows = regionRates.filter(r => r.Region === userCountryRegion);
            if (!regionRows.length) return 0;
            regionRows.sort((a,b) => a.MaxWeight - b.MaxWeight);
            for (const row of regionRows) {
                if (totalWeight <= row.MaxWeight) return row.Cost;
            }
            const last = regionRows[regionRows.length - 1];
            return last.Cost;
        }

        function updateOrderSummary() {
            if (!selectedProduct) return;
            const qty = parseInt(document.getElementById('orderQuantity').value) || 1;
            const unitPrice = selectedProduct.BasePrice;
            const baseSubtotal = unitPrice * qty;
            const discountThreshold = selectedProduct.DiscountThreshold || 0;
            const discountPercent = selectedProduct.DiscountPercent || 0;
            let discountAmount = 0;
            let finalUnitPrice = unitPrice;
            if (qty >= discountThreshold) {
                finalUnitPrice = unitPrice * (1 - discountPercent / 100);
                discountAmount = (unitPrice - finalUnitPrice) * qty;
            }
            const subtotal = finalUnitPrice * qty;
            const shipping = getShippingCost();
            const total = subtotal + shipping;

            document.getElementById('sumUnitPrice').textContent = formatPrice(finalUnitPrice);
            document.getElementById('sumQuantity').textContent = qty;
            document.getElementById('sumSubtotal').textContent = formatPrice(subtotal);
            document.getElementById('sumTotal').textContent = formatPrice(total);

            const discountRow = document.getElementById('discountRow');
            const discountText = document.getElementById('discountText');
            const sumDiscount = document.getElementById('sumDiscount');
            if (qty >= discountThreshold) {
                discountRow.style.display = 'flex';
                discountText.textContent = `${discountPercent}% discount for ${discountThreshold} or more items.`;
                sumDiscount.textContent = '- ' + formatPrice(discountAmount);
            } else {
                discountRow.style.display = 'none';
            }

            const shippingRow = document.getElementById('shippingRow');
            const sumShipping = document.getElementById('sumShipping');
            if (selectedProduct.ype === 'Digital') {
                shippingRow.style.display = 'none';
            } else {
                shippingRow.style.display = 'flex';
                sumShipping.textContent = shipping ? formatPrice(shipping) : '—';
            }
        }

        // ---------- GOOGLE MAPS & ADDRESS ----------
        function loadGoogleMapsScript(apiKey) {
            const script = document.createElement('script');
            script.src = `https://maps.googleapis.com/maps/api/js?key=${apiKey}&libraries=places`;
            script.defer = true;
            script.onload = initAutocomplete;
            document.head.appendChild(script);
        }

        function initAutocomplete() {
            const input = document.getElementById('addressLine1');
            if (!input) return;
            const autocomplete = new google.maps.places.Autocomplete(input, { types: ['address'] });
            autocomplete.addListener('place_changed', () => {
                const place = autocomplete.getPlace();
                fillAddressFromPlace(place);
            });
        }

        function fillAddressFromPlace(place) {
            // Clear previous
            document.getElementById('addressLine2').value = '';
            document.getElementById('addressCity').value = '';
            document.getElementById('addressState').value = '';
            document.getElementById('addressZip').value = '';
            document.getElementById('addressCountry').value = '';

            // Set line 1 from formatted_address or name
            document.getElementById('addressLine1').value = place.formatted_address || place.name || '';

            // Parse components
            for (const comp of place.address_components) {
                const types = comp.types;
                if (types.includes('locality')) {
                    document.getElementById('addressCity').value = comp.long_name;
                } else if (types.includes('administrative_area_level_1')) {
                    document.getElementById('addressState').value = comp.short_name;
                } else if (types.includes('postal_code')) {
                    document.getElementById('addressZip').value = comp.long_name;
                } else if (types.includes('country')) {
                    // Match to dropdown
                    const countryName = comp.long_name;
                    const select = document.getElementById('addressCountry');
                    for (let i = 0; i < select.options.length; i++) {
                        if (select.options[i].text === countryName) {
                            select.value = select.options[i].value;
                            break;
                        }
                    }
                    // Extract region for shipping
                    userCountryRegion = getRegionForCountry(countryName);
                }
            }
            updateOrderSummary();
        }

        function getRegionForCountry(countryName) {
            const match = shippingRegions.find(r => r.Location === countryName);
            if (match) return match.Region;
            // fallback
            const partial = shippingRegions.find(r => countryName.includes(r.Location) || r.Location.includes(countryName));
            return partial ? partial.Region : 'Rest of world';
        }

        // Listen for manual country selection change
        document.getElementById('addressCountry')?.addEventListener('change', function() {
            const country = this.value;
            if (country) {
                userCountryRegion = getRegionForCountry(country);
                updateOrderSummary();
            }
        });

        // ---------- SPA NAVIGATION (unchanged but minor) ----------
        function showPage(sectionId) {
            document.querySelectorAll('.page-section').forEach(s => s.classList.remove('active'));
            const target = document.getElementById(sectionId);
            if (target) target.classList.add('active');
            updateNavTitle(sectionId);
            const currencyContainer = document.getElementById('currencySelectorContainer');
            if (sectionId === 'contact-section' || sectionId === 'about-section') {
                currencyContainer.style.display = 'none';
            } else {
                currencyContainer.style.display = 'flex';
            }
            document.getElementById('navIcons').classList.remove('open');
            document.getElementById('hamburgerBtn').setAttribute('aria-expanded', 'false');
            if (sectionId === 'home-section') setTimeout(equalizeHeights, 50);
            if (sectionId === 'order-section') updateOrderSummary();
        }

        function updateNavTitle(sectionId) {
            const titles = {
                'home-section': '',
                'about-section': appSettings?.AboutPageTitle || 'About',
                'order-section': appSettings?.OrderPageTitle || 'Order',
                'contact-section': appSettings?.ContactPageTitle || 'Contact'
            };
            const titleEl = document.getElementById('pageTitleDisplay');
            titleEl.textContent = titles[sectionId] || '';
            titleEl.style.color = appSettings?.PrimaryColor || '#194373';
        }

        // Hamburger & Contact form (unchanged)
        function setupHamburger() { /* ... */ }
        function setupContactForm() { /* ... */ }

        // ---------- INIT ----------
        async function init() {
            try {
                const allData = await fetchAllSiteData();
                appSettings = allData.settings || {};
                applySettingsDirect(appSettings);

                exchangeRates = allData.exchangeRates || [];
                buildCurrencySelector();
                await detectUserCurrency();

                products = allData.products || [];
                shippingRegions = allData.shippingRegions || [];
                regionRates = allData.regionRates || [];

                if (allData.home) loadHomePageDirect(allData.home);
                if (allData.about) loadAboutSectionDirect(allData.about);
                loadOrderPage();

                setupHamburger();
                setupContactForm();
                equalizeHeights();
            } catch (err) {
                console.error('Error initializing:', err);
            }
        }

        init();
    </script>
