<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Dynamic Website</title>

    <!-- Google Font: Nunito Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&display=swap" rel="stylesheet">

    <style>
        /* ---------- BASE STYLES ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Nunito Sans', sans-serif;
            background-color: #ffffff;  /* will be overridden by sheet setting */
            color: #000000;             /* will be overridden by sheet setting */
            padding-top: 120px;         /* offset for sticky header, adjust as needed */
        }

        /* ---------- STICKY HEADER (Banner + Nav) ---------- */
        .sticky-header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            background: inherit;        /* we'll set the background color via JS */
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        /* Banner: compact, logo-height friendly */
        .banner {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 0.5rem 1rem;      /* short and sweet */
            text-align: center;
            background: inherit;
        }

        .banner img.logo {
            max-height: 50px;          /* adjust to taste, but this keeps it tidy */
            margin-bottom: 0.3rem;
        }

        .banner h1 {
            font-size: 1.3rem;
            font-weight: 700;
            margin: 0.2rem 0;
            line-height: 1.2;
        }

        .banner h2 {
            font-size: 1rem;
            font-weight: 400;
            margin: 0;
            line-height: 1.3;
            opacity: 0.9;
        }

        /* Navigation Icons Bar (still inside sticky header) */
        .nav-icons {
            display: flex;
            justify-content: center;
            gap: 25px;
            padding: 0.6rem 1rem;
            background: rgba(0, 0, 0, 0.03); /* subtle background behind icons */
        }

        .nav-icons a img {
            height: 36px;
            transition: transform 0.2s ease;
        }

        .nav-icons a:hover img {
            transform: scale(1.1);
        }

        /* Main content (now with room to breathe) */
        .content {
            padding: 2rem;
            max-width: 960px;
            margin: 0 auto;
        }

        /* Responsive tweaks */
        @media (max-width: 600px) {
            body {
                padding-top: 110px;
            }
            .banner h1 {
                font-size: 1.1rem;
            }
            .banner h2 {
                font-size: 0.9rem;
            }
            .nav-icons {
                gap: 15px;
            }
        }
    </style>
</head>
<body>
    <!-- Sticky Header: Banner + Nav -->
    <div class="sticky-header" id="stickyHeader">
        <div class="banner" id="banner">
            <img class="logo" id="bannerLogo" src="" alt="Logo">
            <h1 id="bannerTitle"></h1>
            <h2 id="bannerSubtitle"></h2>
        </div>
        <div class="nav-icons" id="navIcons"></div>
    </div>

    <!-- Main Content (placeholder) -->
    <div class="content">
        <p>Welcome! This page is styled live from your Google Sheet.</p>
        <p>You can add any sections here later – contact forms, order details, etc.</p>
    </div>

    <script>
        // ==============================================
        // 🔧 REPLACE THIS URL WITH YOUR WEB APP URL
        // ==============================================
        const API_URL = 'https://script.google.com/macros/s/AKfycbwYyqg5oWjfGuZkBH96GO_htc8ljiI3os3RGbqh2cWJPGkB3efyAnTRkkQex4Cn2c7j/exec';

        async function fetchSettings() {
            const response = await fetch(API_URL);
            const data = await response.json();
            const settings = {};
            data.forEach(item => {
                settings[item.Setting] = item.Value;
            });
            return settings;
        }

        async function applySettings() {
            const s = await fetchSettings();

            // --- Apply Colors ---
            document.body.style.backgroundColor = s.BackgroundColor || '#ffffff';
            document.body.style.color = s.TextColor || '#000000';

            // Sticky header background: use PrimaryColor or default to white
            const header = document.getElementById('stickyHeader');
            header.style.backgroundColor = s.PrimaryColor || '#194373';

            // --- Banner Logo ---
            const bannerLogo = document.getElementById('bannerLogo');
            if (s.LogoURL) {
                bannerLogo.src = s.LogoURL;
                bannerLogo.style.display = 'block';
            } else {
                bannerLogo.style.display = 'none';
            }

            // --- Banner Title: combine BookTitle + Abbreviation (if exists) ---
            const titleEl = document.getElementById('bannerTitle');
            let fullTitle = s.BannerBookTitle || '';
            if (s.BannerBookTitleAbbreviation && s.BannerBookTitleAbbreviation.trim() !== '') {
                fullTitle += ' ' + s.BannerBookTitleAbbreviation;  // e.g., "The ABC of ASD (Azimuth Stern Drive)"
            }
            titleEl.textContent = fullTitle;

            // --- Banner Subtitle ---
            document.getElementById('bannerSubtitle').textContent = s.BannerBookSubTitile || '';

            // --- Navigation Icons ---
            const navContainer = document.getElementById('navIcons');
            navContainer.innerHTML = '';

            const navItems = [
                { setting: 'NavIconURLHome', textSetting: 'HomePageTitle', href: '#' },
                { setting: 'NavIconURLOrder', textSetting: 'OrderPageTitle', href: '#' },
                { setting: 'NavIconURLAbout', textSetting: 'AboutPageTitle', href: '#' },
                { setting: 'NavIconURLContact', textSetting: 'ContactPageTitle', href: '#' },
                { setting: 'NavIconURLLinkedIn', textSetting: null, href: '#', external: true }
            ];

            navItems.forEach(item => {
                const url = s[item.setting];
                if (url && url.trim() !== '') {
                    const a = document.createElement('a');
                    a.href = item.href;
                    if (item.external) a.target = '_blank';
                    const img = document.createElement('img');
                    img.src = url;
                    img.alt = item.setting.replace('NavIconURL', '');
                    a.appendChild(img);
                    navContainer.appendChild(a);
                }
            });
        }

        applySettings().catch(err => console.error('Error applying settings:', err));
    </script>
</body>
</html>
