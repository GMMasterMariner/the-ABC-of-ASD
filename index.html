<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Dynamic Website</title>

    <!-- Google Font: Nunito Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&display=swap" rel="stylesheet">

    <style>
        /* ---------- BASE ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Nunito Sans', sans-serif;
            background-color: #ffffff;  /* overridden by sheet */
            color: #000000;             /* overridden by sheet */
            padding-top: 140px;         /* space for sticky header (adjust if needed) */
        }

        /* ---------- STICKY HEADER (Banner + Nav) ---------- */
        .sticky-header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        /* ---- Banner (dark background, white text, logo left, title center) ---- */
        .banner {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            padding: 0.6rem 1.2rem;
            background-color: #194373;  /* fallback, will be overwritten by PrimaryColor */
            color: #ffffff;             /* white text */
        }

        .banner-logo {
            flex-shrink: 0;
            margin-right: 1rem;
        }

        .banner-logo img {
            max-height: 45px;
            display: block;
        }

        .banner-text {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .banner-text h1 {
            font-size: 1.4rem;
            font-weight: 700;
            line-height: 1.2;
            margin: 0;
            color: inherit;
        }

        .banner-text h2 {
            font-size: 0.95rem;
            font-weight: 400;
            line-height: 1.3;
            margin: 0.2rem 0 0 0;
            color: inherit;
            opacity: 0.9;
        }

        /* ---- Nav Bar (white, icons left, page title centered) ---- */
        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: #ffffff;
            padding: 0.4rem 1.2rem;
            border-top: 1px solid rgba(0,0,0,0.05);
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 1.2rem;
        }

        .nav-left a {
            display: inline-flex;
            align-items: center;
            text-decoration: none;
        }

        .nav-left a img {
            height: 30px;
            transition: transform 0.2s ease;
        }

        .nav-left a:hover img {
            transform: scale(1.15);
        }

        .nav-center {
            flex: 1;
            text-align: center;
            font-size: 1.1rem;
            font-weight: 600;
            color: #194373;  /* brand primary color, set by JS */
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            padding: 0 1rem;
        }

        /* ---- Main Content ---- */
        .content {
            padding: 2rem;
            max-width: 960px;
            margin: 0 auto;
        }

        /* ---------- RESPONSIVE ---------- */
        @media (max-width: 600px) {
            body {
                padding-top: 130px;
            }
            .banner {
                padding: 0.5rem 0.8rem;
            }
            .banner-logo img {
                max-height: 35px;
            }
            .banner-text h1 {
                font-size: 1.1rem;
            }
            .banner-text h2 {
                font-size: 0.8rem;
            }
            .navbar {
                padding: 0.3rem 0.6rem;
            }
            .nav-left {
                gap: 0.8rem;
            }
            .nav-left a img {
                height: 24px;
            }
            .nav-center {
                font-size: 0.9rem;
            }
        }

        @media (max-width: 400px) {
            .banner-logo {
                margin-right: 0.5rem;
            }
            .banner-text h1 {
                font-size: 1rem;
            }
            .nav-left {
                gap: 0.5rem;
            }
            .nav-center {
                font-size: 0.8rem;
                padding: 0 0.5rem;
            }
        }
    </style>
</head>
<body>
    <!-- ================== STICKY HEADER ================== -->
    <div class="sticky-header" id="stickyHeader">
        <!-- Banner: Logo left + Title/Subtitle center -->
        <div class="banner" id="banner">
            <div class="banner-logo">
                <img id="bannerLogo" src="" alt="Logo">
            </div>
            <div class="banner-text">
                <h1 id="bannerTitle"></h1>
                <h2 id="bannerSubtitle"></h2>
            </div>
        </div>

        <!-- Navigation Bar: Icons left + Page title center -->
        <nav class="navbar" id="navbar">
            <div class="nav-left" id="navIcons"></div>
            <div class="nav-center" id="pageTitleDisplay">Home</div>
        </nav>
    </div>

    <!-- ================== MAIN CONTENT ================== -->
    <div class="content">
        <p>Welcome! This page is styled live from your Google Sheet.</p>
        <p>Add your own content, forms, or anything you like here.</p>
    </div>

    <script>
        // ==============================================
        // 🔧 REPLACE THIS URL WITH YOUR WEB APP URL
        // ==============================================
        const API_URL = 'https://script.google.com/macros/s/AKfycbwYyqg5oWjfGuZkBH96GO_htc8ljiI3os3RGbqh2cWJPGkB3efyAnTRkkQex4Cn2c7j/exec';

        async function fetchSettings() {
            const response = await fetch(API_URL);
            const data = await response.json();
            const settings = {};
            data.forEach(item => {
                settings[item.Setting] = item.Value;
            });
            return settings;
        }

        async function applySettings() {
            const s = await fetchSettings();

            // --- Page colors ---
            document.body.style.backgroundColor = s.BackgroundColor || '#ffffff';
            document.body.style.color = s.TextColor || '#000000';

            // --- Sticky header / Banner background = PrimaryColor ---
            const banner = document.getElementById('banner');
            banner.style.backgroundColor = s.PrimaryColor || '#194373';

            // --- Banner logo ---
            const bannerLogo = document.getElementById('bannerLogo');
            if (s.LogoURL) {
                bannerLogo.src = s.LogoURL;
                bannerLogo.style.display = 'block';
            } else {
                bannerLogo.style.display = 'none';
            }

            // --- Banner title (combine BookTitle + Abbreviation) ---
            const titleEl = document.getElementById('bannerTitle');
            let fullTitle = s.BannerBookTitle || '';
            if (s.BannerBookTitleAbbreviation && s.BannerBookTitleAbbreviation.trim() !== '') {
                fullTitle += ' ' + s.BannerBookTitleAbbreviation;
            }
            titleEl.textContent = fullTitle;

            // --- Banner subtitle ---
            document.getElementById('bannerSubtitle').textContent = s.BannerBookSubTitile || '';

            // --- Navigation icons (left side) ---
            const navContainer = document.getElementById('navIcons');
            navContainer.innerHTML = '';

            const navItems = [
                { setting: 'NavIconURLHome', textSetting: 'HomePageTitle', href: '#' },
                { setting: 'NavIconURLOrder', textSetting: 'OrderPageTitle', href: '#' },
                { setting: 'NavIconURLAbout', textSetting: 'AboutPageTitle', href: '#' },
                { setting: 'NavIconURLContact', textSetting: 'ContactPageTitle', href: '#' },
                { setting: 'NavIconURLLinkedIn', textSetting: null, href: '#', external: true }
            ];

            navItems.forEach(item => {
                const url = s[item.setting];
                if (url && url.trim() !== '') {
                    const a = document.createElement('a');
                    a.href = item.href;
                    if (item.external) a.target = '_blank';
                    const img = document.createElement('img');
                    img.src = url;
                    img.alt = item.setting.replace('NavIconURL', '');
                    a.appendChild(img);
                    navContainer.appendChild(a);
                }
            });

            // --- Page title in center of navbar (use HomePageTitle or fallback) ---
            const pageTitle = s.HomePageTitle || 'Home';
            const pageTitleEl = document.getElementById('pageTitleDisplay');
            pageTitleEl.textContent = pageTitle;
            pageTitleEl.style.color = s.PrimaryColor || '#194373';
        }

        applySettings().catch(err => console.error('Error applying settings:', err));
    </script>
</body>
</html>
