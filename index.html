<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Dynamic Website</title>

    <!-- Google Font: Nunito Sans (all weights) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&display=swap" rel="stylesheet">

    <style>
        /* ---------- BASE ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Nunito Sans', sans-serif;
            background-color: #ffffff;  /* sheet override */
            color: #000000;             /* sheet override */
            padding-top: 140px;         /* space for sticky header */
        }

        /* ---------- STICKY HEADER ---------- */
        .sticky-header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        /* ---- Banner: logo absolute left, text truly centered ---- */
        .banner {
            position: relative;
            background-color: #194373;  /* fallback, overridden by PrimaryColor */
            color: #ffffff;
            padding: 0.8rem 1.2rem;
            min-height: 60px;           /* ensures enough height for logo */
        }

        .banner-logo {
            position: absolute;
            left: 1.2rem;
            top: 50%;
            transform: translateY(-50%);
            z-index: 2;
        }

        .banner-logo img {
            max-height: 45px;
            display: block;
        }

        .banner-text {
            width: 100%;
            text-align: center;
        }

        .banner-text h1 {
            font-size: 1.4rem;
            font-weight: 700;
            line-height: 1.2;
            margin: 0;
        }

        /* abbreviation inside h1 – lighter weight */
        .banner-text h1 .abbreviation {
            font-weight: 300;           /* Light */
            opacity: 0.95;
        }

        .banner-text h2 {
            font-size: 1.05rem;         /* slightly larger than before */
            font-weight: 400;
            line-height: 1.3;
            margin: 0.25rem 0 0 0;
            opacity: 0.9;
        }

        /* ---- Nav Bar: white, icons left, page title absolutely centered ---- */
        .navbar {
            position: relative;
            display: flex;
            align-items: center;
            background-color: #ffffff;
            padding: 0.5rem 1.2rem;
            border-top: 1px solid rgba(0,0,0,0.05);
            min-height: 48px;
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 1.2rem;
            z-index: 2;
        }

        .nav-left a {
            display: inline-flex;
            align-items: center;
            text-decoration: none;
        }

        .nav-left a img {
            height: 30px;
            transition: transform 0.2s ease;
        }

        .nav-left a:hover img {
            transform: scale(1.15);
        }

        .nav-center {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            font-size: 1.1rem;
            font-weight: 600;
            color: #194373;             /* set dynamically */
            white-space: nowrap;
            pointer-events: none;       /* allow clicks to pass through to icons behind */
            z-index: 1;
        }

        /* ---- Main Content ---- */
        .content {
            padding: 2rem;
            max-width: 960px;
            margin: 0 auto;
        }

        /* ---------- RESPONSIVE ---------- */
        @media (max-width: 600px) {
            body {
                padding-top: 125px;
            }
            .banner {
                padding: 0.6rem 0.8rem;
                min-height: 52px;
            }
            .banner-logo {
                left: 0.8rem;
            }
            .banner-logo img {
                max-height: 35px;
            }
            .banner-text h1 {
                font-size: 1.1rem;
            }
            .banner-text h2 {
                font-size: 0.9rem;
            }
            .navbar {
                padding: 0.4rem 0.6rem;
                min-height: 42px;
            }
            .nav-left {
                gap: 0.8rem;
            }
            .nav-left a img {
                height: 24px;
            }
            .nav-center {
                font-size: 0.95rem;
            }
        }

        @media (max-width: 480px) {
            /* On very small screens, hide the centered page title to avoid icon overlap */
            .nav-center {
                display: none;
            }
            .nav-left {
                justify-content: center;  /* optionally center the icons themselves */
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <!-- ================== STICKY HEADER ================== -->
    <div class="sticky-header" id="stickyHeader">
        <!-- Banner: logo absolute left + title/subtitle centered -->
        <div class="banner" id="banner">
            <div class="banner-logo">
                <img id="bannerLogo" src="" alt="Logo">
            </div>
            <div class="banner-text">
                <h1 id="bannerTitle"></h1>
                <h2 id="bannerSubtitle"></h2>
            </div>
        </div>

        <!-- Navigation Bar: icons left + page title absolutely centered -->
        <nav class="navbar" id="navbar">
            <div class="nav-left" id="navIcons"></div>
            <div class="nav-center" id="pageTitleDisplay">Home</div>
        </nav>
    </div>

    <!-- ================== MAIN CONTENT ================== -->
    <div class="content">
        <p>Welcome! This page is styled live from your Google Sheet.</p>
        <p>Add your own content, forms, or anything you like here.</p>
    </div>

    <script>
        // ==============================================
        // 🔧 REPLACE THIS URL WITH YOUR WEB APP URL
        // ==============================================
        const API_URL = 'https://script.google.com/macros/s/AKfycbwYyqg5oWjfGuZkBH96GO_htc8ljiI3os3RGbqh2cWJPGkB3efyAnTRkkQex4Cn2c7j/exec';

        async function fetchSettings() {
            const response = await fetch(API_URL);
            const data = await response.json();
            const settings = {};
            data.forEach(item => {
                settings[item.Setting] = item.Value;
            });
            return settings;
        }

        async function applySettings() {
            const s = await fetchSettings();

            // --- Page colors ---
            document.body.style.backgroundColor = s.BackgroundColor || '#ffffff';
            document.body.style.color = s.TextColor || '#000000';

            // --- Banner background = PrimaryColor ---
            const banner = document.getElementById('banner');
            banner.style.backgroundColor = s.PrimaryColor || '#194373';

            // --- Banner logo ---
            const bannerLogo = document.getElementById('bannerLogo');
            if (s.LogoURL) {
                bannerLogo.src = s.LogoURL;
                bannerLogo.style.display = 'block';
            } else {
                bannerLogo.style.display = 'none';
            }

            // --- Banner title with abbreviation in lighter font ---
            const titleEl = document.getElementById('bannerTitle');
            const mainTitle = s.BannerBookTitle || '';
            const abbrev = s.BannerBookTitleAbbreviation && s.BannerBookTitleAbbreviation.trim() !== '' 
                            ? s.BannerBookTitleAbbreviation 
                            : '';

            if (mainTitle && abbrev) {
                // Wrap abbreviation in a span for light weight styling
                titleEl.innerHTML = `${mainTitle} <span class="abbreviation">${abbrev}</span>`;
            } else if (mainTitle) {
                titleEl.textContent = mainTitle;
            } else {
                titleEl.textContent = '';
            }

            // --- Banner subtitle ---
            document.getElementById('bannerSubtitle').textContent = s.BannerBookSubTitile || '';

            // --- Navigation icons (left side) ---
            const navContainer = document.getElementById('navIcons');
            navContainer.innerHTML = '';

            const navItems = [
                { setting: 'NavIconURLHome', textSetting: 'HomePageTitle', href: '#' },
                { setting: 'NavIconURLOrder', textSetting: 'OrderPageTitle', href: '#' },
                { setting: 'NavIconURLAbout', textSetting: 'AboutPageTitle', href: '#' },
                { setting: 'NavIconURLContact', textSetting: 'ContactPageTitle', href: '#' },
                { setting: 'NavIconURLLinkedIn', textSetting: null, href: '#', external: true }
            ];

            navItems.forEach(item => {
                const url = s[item.setting];
                if (url && url.trim() !== '') {
                    const a = document.createElement('a');
                    a.href = item.href;
                    if (item.external) a.target = '_blank';
                    const img = document.createElement('img');
                    img.src = url;
                    img.alt = item.setting.replace('NavIconURL', '');
                    a.appendChild(img);
                    navContainer.appendChild(a);
                }
            });

            // --- Page title in center of navbar ---
            const pageTitle = s.HomePageTitle || 'Home';
            const pageTitleEl = document.getElementById('pageTitleDisplay');
            pageTitleEl.textContent = pageTitle;
            pageTitleEl.style.color = s.PrimaryColor || '#194373';
        }

        applySettings().catch(err => console.error('Error applying settings:', err));
    </script>
</body>
</html>
