<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GM Master Mariner – Books</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
  <style>
    /* ========== GLOBAL RESET & VARIABLES ========== */
    html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#eee6ca; }
    :root {
      --primary:#194373; --secondary:#5693ac; --bg:#eee6ca;
      --cta:#f29b2a; --alert:#dc3c33; --text:#2c3e50;
    }
    * { box-sizing:border-box; }
    body { font-family:'Segoe UI',Arial,sans-serif; color:var(--text); display:flex; flex-direction:column; }

    /* ========== FIXED HEADER (FULL WIDTH) ========== */
    .sticky-header {
      flex-shrink: 0; width: 100%; background: white;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08); z-index: 100;
    }
    .brand-banner {
      display: flex; align-items: center; background: var(--primary);
      padding: 12px 20px; color: white;
    }
    .brand-banner img.logo { height:55px; width:auto; margin-right:20px; }
    .banner-text { flex:1; text-align:center; }
    .banner-text .book-title { margin:0; font-size:clamp(1rem, 2.5vw, 1.5rem); font-weight:700; }
    .banner-text .book-title .abbreviation { font-size:0.85em; font-weight:400; opacity:0.9; }
    .banner-text .guide-subtitle { margin:4px 0 0; font-size:clamp(0.85rem, 2vw, 1.1rem); font-weight:600; }

    .top-bar {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 20px; background: white; flex-wrap: wrap; gap: 15px;
    }
    .icon-links { display:flex; gap:20px; align-items:center; }
    .icon-links a { display:inline-block; line-height:0; cursor:pointer; }
    .icon-links img { width:28px; height:28px; object-fit:cover; }
    .page-subtitle { flex:1; text-align:center; color:var(--primary); font-size:clamp(1rem, 3vw, 1.3rem); font-weight:600; visibility:hidden; }
    .page-subtitle.visible { visibility:visible; }
    .currency-selector { display:flex; align-items:center; gap:8px; }
    .currency-selector label { font-weight:600; color:var(--primary); margin:0; }
    .currency-selector select { padding:8px 10px; border-radius:6px; border:1px solid #ccc; font-size:14px; }
    .currency-flag { height:18px; }

    /* ========== SCROLLABLE CONTENT ========== */
    .main-scroll {
      flex: 1 1 auto; overflow-y: auto; width: 100%;
      -webkit-overflow-scrolling: touch; scrollbar-width: none; -ms-overflow-style: none;
    }
    .main-scroll::-webkit-scrollbar { display: none; }
    .main-content { width: 100%; padding: 20px 20px; }

    /* ========== HOME PAGE ========== */
    .home-headline { text-align:center; font-size:clamp(1.4rem, 3.5vw, 2rem); color:var(--primary); margin:0 0 25px 0; }
    .home-three-col { display: flex; gap: 30px; }
    .home-col { flex: 1 1 0; min-width: 0; }
    .home-description { font-size:1rem; line-height:1.6; max-width:600px; }
    .home-carousel .swiper { width:100%; max-width:100%; }
    .home-carousel .swiper-slide img { max-height:350px; object-fit:contain; }
    .format-prices { display:flex; flex-direction:column; gap:20px; margin-bottom:25px; }
    .format-price-box { text-align:center; }
    .format-name { font-weight:600; color:var(--primary); margin-bottom:4px; }
    .format-price { font-size:1.5rem; font-weight:700; color:var(--alert); }
    .order-now-btn {
      display:block; background:var(--cta); color:white; padding:14px 20px;
      border-radius:6px; font-size:18px; font-weight:600; cursor:pointer;
      border:none; transition:background 0.2s; text-align:center; width:100%;
    }
    .order-now-btn:hover { background:#e0841c; }

    /* ========== MOBILE LAYOUT – STACKING ========== */
    @media (max-device-width: 768px) {
      .home-three-col { flex-direction: column !important; }
      .home-col { flex: 1 1 100% !important; max-width: 100% !important; }
      .home-description {
        max-width: 100% !important; text-align: center !important; margin: 0 auto !important;
      }
      .home-carousel .swiper-slide img { margin: 0 auto !important; }
      .format-prices {
        flex-direction: row !important; justify-content: center !important;
        gap: 30px !important; margin-bottom: 15px !important;
      }
      .order-now-btn { max-width: 350px !important; margin: 0 auto !important; }
      .home-col:last-child { display: flex; flex-direction: column; align-items: center; }
      .top-bar { flex-direction: row !important; flex-wrap: wrap; }
      .page-subtitle { order: 0; width: auto; }
      .address-grid { grid-template-columns: 1fr !important; }
      .verification-buttons { flex-direction: column !important; }
      .verification-buttons button { width: 100% !important; }
      .contact-row { flex-direction: column !important; }
      .brand-banner { padding: 10px 15px; flex-wrap: wrap; justify-content: center; text-align: center; }
      .brand-banner img.logo { height: 40px; margin: 0 0 8px 0; }
      .banner-text { text-align: center; }
      .radio-item-content { flex-direction: column; align-items: flex-start; }
      .quantity-wrapper { width: 100% !important; }
      .code-digit { width: 36px; height: 48px; font-size: 1.3rem; }
    }

    /* ========== OTHER SECTIONS ========== */
    .customer-fields { display:flex; gap:20px; flex-wrap:wrap; margin-bottom:20px; }
    .customer-fields .field { flex:1; min-width:200px; }
    .customer-fields .field label { display:block; margin-bottom:6px; font-weight:600; color:var(--primary); }
    .customer-fields .field input { width:100%; padding:12px; border-radius:6px; border:1px solid #ccc; font-size:16px; }

    .verification-group { display:flex; align-items:flex-start; gap:15px; margin-bottom:15px; flex-wrap:wrap; }
    .code-boxes { display:flex; gap:6px; }
    .code-digit { width:45px; height:55px; text-align:center; font-size:1.5rem; font-weight:700; border:1px solid #ccc; border-radius:8px; }
    .verification-buttons { display:flex; gap:8px; flex:1; flex-wrap:wrap; }
    .verification-buttons button {
      background:var(--secondary); color:white; border:none; border-radius:6px; cursor:pointer;
      font-weight:600; font-size:0.95rem; padding:12px 20px; flex:1; min-width:120px; height:55px;
      transition:background 0.2s; white-space:nowrap;
    }
    .verification-buttons button:hover:not(:disabled) { background:var(--cta); }
    .verification-buttons button.active { background:var(--cta); }
    .verification-buttons button:disabled { opacity:0.6; cursor:not-allowed; background:var(--secondary); }
    .verification-buttons button.hidden-btn { display:none !important; }
    .verification-buttons button.sending { animation:pulse 1s infinite; background:var(--cta); cursor:wait; }
    @keyframes pulse { 0%{opacity:0.7;} 50%{opacity:1;} 100%{opacity:0.7;} }
    .email-verified-badge { color:#00973d; font-weight:600; margin-left:10px; }
    .verification-message { margin-top:8px; font-size:0.9em; color:var(--secondary); font-weight:500; display:none; text-align:center; }

    .product-selection { margin:20px 0; }
    .product-options { display:flex; align-items:stretch; gap:20px; flex-wrap:wrap; }
    .radio-list { flex:2; display:flex; flex-direction:column; gap:10px; }
    .radio-item { display:flex; align-items:center; gap:10px; padding:12px 15px; background:#fafaf5; border:1px solid #e0d9c7; border-radius:6px; cursor:pointer; }
    .radio-item:hover { background:#f0ede0; }
    .radio-item input[type="radio"] { display:none; }
    .radio-item .radio-visual { width:20px; height:20px; border-radius:50%; border:2px solid var(--secondary); background:white; flex-shrink:0; }
    .radio-item input:checked + .radio-visual { background:var(--alert); border-color:var(--alert); box-shadow:0 0 0 3px rgba(220,60,51,0.25); }
    .radio-item-content { display:flex; align-items:center; gap:10px; flex:1; flex-wrap:wrap; }
    .product-name { font-weight:600; color:var(--primary); flex:1; }
    .product-total-price { font-weight:600; color:var(--alert); white-space:nowrap; font-size:1.1em; }
    .quantity-wrapper { width:100px; flex-shrink:0; display:flex; flex-direction:column; }
    .quantity-wrapper label { margin-bottom:6px; font-size:0.9em; }
    .quantity-wrapper input { padding:15px 10px; text-align:center; font-size:1.2rem; border-radius:6px; border:1px solid #ccc; }

    .shipping-title { display:flex; align-items:center; margin-top:25px; color:var(--primary); }
    .address-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px 20px; margin-top:15px; }
    .address-cell { display:flex; flex-direction:column; }
    .address-cell label { margin:6px 0 4px; font-weight:600; color:var(--primary); }
    .address-cell input, .address-cell select, .address-cell textarea {
      width:100%; padding:12px; border-radius:6px; border:1px solid #ccc; font-size:16px; margin-bottom:0;
    }
    .phone-row { display:flex; gap:8px; }
    .phone-row select { flex:1; padding:12px; border-radius:6px; border:1px solid #ccc; }
    .phone-row input { flex:2; }
    textarea { font-family:inherit; resize:vertical; }
    .shipping-time { font-size:0.9em; color:var(--cta); margin-top:4px; font-weight:600; }

    .result-box { background:#f8f6f1; padding:20px; margin:25px 0; border-radius:8px; border:1px solid #e0d9c7; }
    .result-box p { margin:8px 0; font-size:16px; }

    .payment-buttons { text-align:center; margin-top:30px; }
    .payment-buttons .btn-row { display:flex; justify-content:center; gap:15px; flex-wrap:wrap; margin-top:20px; }
    .payment-btn { color:white; padding:14px 30px; border:none; border-radius:6px; font-size:16px; font-weight:600; cursor:pointer; display:inline-flex; align-items:center; gap:8px; min-width:180px; }
    #paypalButton { background:var(--cta); }
    #paypalButton:hover { background:#e0841c; }
    #payfastButton { background:var(--cta); }
    #payfastButton:hover { background:#e0841c; }
    .payment-btn img.payment-icon { height:20px; }
    #paymentLinkContainer { margin-top:20px; }

    .about-content, .contact-content { max-width:800px; margin:0 auto; }
    .author-image { float:left; max-width:200px; margin:0 25px 15px 0; border-radius:8px; }
    .bio-text { font-size:1rem; line-height:1.6; }
    .contact-content h3 { margin-bottom:20px; }
    .contact-content label { display:block; margin:10px 0 4px; font-weight:600; color:var(--primary); }
    .contact-content input, .contact-content textarea { width:100%; padding:12px; border-radius:6px; border:1px solid #ccc; font-size:16px; margin-bottom:10px; }
    .contact-row { display:flex; gap:20px; }
    .contact-row .half { flex:1; }
    .contact-send-btn { background:var(--cta); color:white; padding:14px 40px; border:none; border-radius:6px; font-size:16px; font-weight:600; cursor:pointer; display:block; margin:20px auto 0; }
    .contact-send-btn:hover { background:#e0841c; }

    .modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:1000; justify-content:center; align-items:center; }
    .modal-content { background:white; max-width:450px; width:90%; border-radius:12px; overflow:hidden; animation:fadeInUp 0.2s; }
    @keyframes fadeInUp { from{opacity:0; transform:translateY(20px);} to{opacity:1; transform:translateY(0);} }
    .modal-header { background:var(--primary); color:white; padding:15px 20px; font-size:1.2rem; font-weight:600; }
    .modal-body { padding:20px; }
    .modal-buttons { display:flex; justify-content:flex-end; gap:12px; padding:15px 20px; background:#fafaf5; border-top:1px solid #e0d9c7; }
    .modal-btn { padding:8px 20px; border:none; border-radius:6px; font-weight:600; cursor:pointer; }
    .modal-btn-cancel { background:#ccc; color:#333; }
    .modal-btn-confirm { background:var(--cta); color:white; }
    .modal-btn-ok { background:var(--secondary); color:white; }

    .content-section { display:none; }
    .content-section.active { display:block; }
  </style>
</head>
<body>

<!-- ========== FIXED HEADER ========== -->
<div class="sticky-header">
  <div class="brand-banner">
    <img class="logo" id="brandLogo" src="" alt="Logo">
    <div class="banner-text">
      <h2 class="book-title">The ABC of ASD <span class="abbreviation">(Azimuth Stern Drive)</span></h2>
      <p class="guide-subtitle">A Guide to ASD Tug Handling</p>
    </div>
  </div>
  <div class="top-bar">
    <div class="icon-links">
      <a id="homeIconLink" title="Home"><img id="homeIconImg" src="" alt="Home"></a>
      <a id="aboutIconLink" title="About"><img id="authorIconImg" src="" alt="Author" style="display:none;"></a>
      <a id="contactIconLink" title="Contact"><img id="contactIconImg" src="" alt="Contact" style="display:none;"></a>
      <a id="linkedinIconLink" target="_blank"><img class="linkedin-icon" src="" alt="LinkedIn"></a>
    </div>
    <p class="page-subtitle" id="pageSubtitle"></p>
    <div class="currency-selector" id="currencySelector">
      <label for="currencySelect">Currency:</label>
      <img id="currencyFlag" class="currency-flag" src="" alt="">
      <select id="currencySelect"></select>
    </div>
  </div>
</div>

<!-- ========== SCROLLABLE CONTENT ========== -->
<div class="main-scroll">
  <div class="main-content">

    <!-- HOME -->
    <div class="content-section active" id="homeSection">
      <div class="home-headline" id="homeHeadline"></div>
      <div class="home-three-col">
        <div class="home-col">
          <div class="home-description" id="homeDescription"></div>
        </div>
        <div class="home-col home-col-center">
          <div class="home-carousel">
            <div class="swiper" id="bookCarousel"><div class="swiper-wrapper" id="swiperWrapper"></div></div>
          </div>
        </div>
        <div class="home-col">
          <div class="format-prices" id="formatPrices"></div>
          <button class="order-now-btn" id="orderNowBtn">Order Now</button>
        </div>
      </div>
    </div>

    <!-- ORDER -->
    <div class="content-section" id="orderSection">
      <div class="customer-fields">
        <div class="field"><label for="customerName">Full name / Company <span style="color:var(--alert);">*</span></label><input type="text" id="customerName" placeholder="Enter name or company"></div>
        <div class="field">
          <label for="email">Email address <span style="color:var(--alert);">*</span></label>
          <input type="email" id="email" placeholder="your@email.com">
          <span id="emailVerifiedBadge" class="email-verified-badge" style="display:none;">✓ Verified</span>
        </div>
      </div>

      <div class="verification-group" id="verificationContainer">
        <div class="code-boxes" id="codeBoxes"></div>
        <div class="verification-buttons" id="verificationButtons">
          <button id="sendCodeBtn">Send verification code</button>
          <button id="resendCodeBtn" class="hidden-btn">Resend code</button>
          <button id="verifyCodeBtn" disabled class="hidden-btn">Verify</button>
        </div>
      </div>
      <div id="verificationMessage" class="verification-message">Check your email for the verification code.</div>

      <div id="productSelectionContainer" style="display:none;">
        <div class="product-selection">
          <label style="font-weight:600; color:var(--primary);">Select book format <span style="color:var(--alert);">*</span></label>
          <div class="product-options">
            <div class="radio-list" id="radioList"></div>
            <div class="quantity-wrapper"><label>Quantity</label><input type="number" id="quantity" value="1" min="1" step="1"></div>
          </div>
        </div>
      </div>

      <div id="shippingSection" style="display:none;">
        <h3 class="shipping-title">Shipping Address <img id="useLocationBtn" src="https://cdn-icons-png.flaticon.com/512/1865/1865269.png" style="cursor:pointer; margin-left:10px; width:24px; height:24px;" title="Use my location"></h3>
        <div class="address-grid">
          <div class="address-cell"><label>Address Line 1</label><input type="text" id="addressLine1" placeholder="Start typing…" autocomplete="off"></div>
          <div class="address-cell"><label>Suburb</label><input type="text" id="suburb" placeholder="Suburb"></div>
          <div class="address-cell"><label>Address Line 2</label><input type="text" id="addressLine2" placeholder="Apartment, etc."></div>
          <div class="address-cell"><label>City</label><input type="text" id="city" placeholder="City"></div>
          <div class="address-cell"><label>Shipping notes (optional)</label><textarea id="shippingNotes" rows="2" placeholder="Instructions..."></textarea></div>
          <div class="address-cell">
            <label>Postal Code</label><input type="text" id="postalCode" placeholder="Code">
            <div id="shippingTimeDisplay" class="shipping-time"></div>
          </div>
          <div class="address-cell">
            <label>Phone (optional)</label>
            <div class="phone-row">
              <select id="orderPhoneCountrySelect"></select>
              <input type="text" id="orderPhoneNumber" placeholder="Phone number">
            </div>
          </div>
          <div class="address-cell">
            <label>Country / Region</label>
            <select id="countrySelect"><option value="">-- Select --</option></select>
            <img id="shippingFlag" src="" style="height:14px; margin-top:4px;">
          </div>
        </div>
      </div>

      <div class="result-box">
        <p>Unit price: <strong><span id="unitPriceDisplay">–</span></strong></p>
        <p>Discount: <strong><span id="discountDisplay">–</span></strong> <span id="discountNote" style="color:var(--alert); font-size:0.9em;"></span></p>
        <p>Subtotal: <strong><span id="totalBeforeShippingDisplay">–</span></strong></p>
        <p>Shipping: <strong><span id="shippingCostDisplay">–</span></strong></p>
        <p><strong>Total: <span id="finalTotalDisplay">–</span></strong></p>
      </div>

      <div id="paymentSection" class="payment-buttons" style="display:none;">
        <h3>Choose payment method</h3>
        <div class="btn-row">
          <button id="paypalButton" class="payment-btn" disabled>Pay with <img id="paypalLogoImg" src="" class="payment-icon"></button>
          <button id="payfastButton" class="payment-btn" disabled>Pay with <img id="payfastLogoImg" src="" class="payment-icon"></button>
        </div>
        <div id="paymentLinkContainer" style="display:none;"></div>
      </div>
    </div>

    <!-- ABOUT -->
    <div class="content-section" id="aboutSection">
      <div class="about-content">
        <img class="author-image" id="authorImage" src="" alt="Author photo">
        <div class="bio-text" id="bioTextContainer"></div>
      </div>
    </div>

    <!-- CONTACT -->
    <div class="content-section" id="contactSection">
      <div class="contact-content">
        <h3>Contact Me</h3>
        <label>Your Name <span style="color:var(--alert);">*</span></label>
        <input type="text" id="contactName" placeholder="Your full name">
        <div class="contact-row">
          <div class="half"><label>Your Email <span style="color:var(--alert);">*</span></label><input type="email" id="contactEmail" placeholder="your@email.com"></div>
          <div class="half">
            <label>Phone (optional)</label>
            <div class="phone-row">
              <select id="contactPhoneCountrySelect"></select>
              <input type="text" id="contactPhone" placeholder="Phone number">
            </div>
          </div>
        </div>
        <label>Message <span style="color:var(--alert);">*</span></label>
        <textarea id="contactMessage" rows="6" placeholder="How can I help you?"></textarea>
        <button id="contactSendBtn" class="contact-send-btn">Send Message</button>
      </div>
    </div>
  </div>
</div>

<!-- ========== MODAL ========== -->
<div id="customModal" class="modal">
  <div class="modal-content">
    <div class="modal-header" id="modalHeader">Notice</div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-buttons" id="modalButtons"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
<script>
  // ========== CONFIGURATION – REPLACE WITH YOUR APPS SCRIPT URL ==========
  const API_BASE = 'YOUR_APPS_SCRIPT_URL';  // e.g., https://script.google.com/macros/s/.../exec

  // ========== FLAWLESS MOBILE DETECTION & FONT SCALING ==========
  const mobileQuery = window.matchMedia('(max-device-width: 768px)');
  function applyMobileLayout() {
    if (mobileQuery.matches) {
      document.body.classList.add('mobile-layout');
      document.documentElement.style.fontSize = (window.innerWidth / 400) * 16 + 'px';
    } else {
      document.body.classList.remove('mobile-layout');
      document.documentElement.style.fontSize = '';
    }
  }
  mobileQuery.addEventListener('change', applyMobileLayout);
  applyMobileLayout();
  window.addEventListener('resize', applyMobileLayout);

  // ========== GLOBAL STATE ==========
  let allData = null;
  let productMap = {};
  let selectedCurrency = 'ZAR';
  let swiper = null;
  let emailVerified = false;
  let currentEmail = '';

  // ========== API HELPER ==========
  async function apiCall(action, data = {}) {
    const url = new URL(API_BASE);
    url.searchParams.set('action', action);
    const options = { method: 'GET' };
    if (Object.keys(data).length) {
      options.method = 'POST';
      options.headers = { 'Content-Type': 'application/json' };
      options.body = JSON.stringify(data);
    }
    const response = await fetch(url, options);
    return response.json();
  }

  // ========== INITIAL LOAD ==========
  async function init() {
    allData = await apiCall('getAllData');
    if (allData.error) { alert('Error loading data: ' + allData.error); return; }

    // Populate product map
    allData.products.forEach(p => productMap[p.type] = p);

    // Brand settings
    applyBrand(allData.brandSettings);

    // Currency dropdown
    populateCurrencyDropdown(allData.exchangeCountryNames);

    // Phone country selects
    populatePhoneSelects(allData.shippingLocations);

    // Detect user country
    await detectCountry();

    // Build the home page
    buildHomePage();

    // Set initial page navigation
    navigateTo('home');
  }

  function applyBrand(bs) {
    if (bs.LogoURL) document.getElementById('brandLogo').src = bs.LogoURL;
    const r = document.documentElement;
    if (bs.PrimaryColor) r.style.setProperty('--primary', bs.PrimaryColor);
    if (bs.SecondaryColor) r.style.setProperty('--secondary', bs.SecondaryColor);
    if (bs.BackgroundColor) r.style.setProperty('--bg', bs.BackgroundColor);
    if (bs.CTAColor) r.style.setProperty('--cta', bs.CTAColor);
    if (bs.AlertColor) r.style.setProperty('--alert', bs.AlertColor);
    if (bs.TextColor) r.style.setProperty('--text', bs.TextColor);

    document.getElementById('homeIconImg').src = bs.HomeIconURL || 'https://cdn-icons-png.flaticon.com/512/25/25694.png';
    document.querySelector('.linkedin-icon').src = bs.LinkedInIconURL || 'https://cdn-icons-png.flaticon.com/512/174/174857.png';
    if (allData.about?.AuthorImageURL) {
      document.getElementById('authorIconImg').src = allData.about.AuthorImageURL;
      document.getElementById('authorIconImg').style.display = 'inline';
    }
    if (bs.ContactIconURL) {
      document.getElementById('contactIconImg').src = bs.ContactIconURL;
      document.getElementById('contactIconImg').style.display = 'inline';
    }
    if (bs.PayPalLogo) document.getElementById('paypalLogoImg').src = bs.PayPalLogo;

  // ========== VERIFICATION ==========
  let verificationCode = '';
  const sendBtn = document.getElementById('sendCodeBtn');
  const resendBtn = document.getElementById('resendCodeBtn');
  const verifyBtn = document.getElementById('verifyCodeBtn');
  const codeBoxesDiv = document.getElementById('codeBoxes');
  let digitInputs = [];

  function createCodeBoxes() {
    codeBoxesDiv.innerHTML = '';
    digitInputs = [];
    for (let i=0; i<6; i++) {
      const inp = document.createElement('input');
      inp.type='text'; inp.maxLength=1; inp.className='code-digit'; inp.inputMode='numeric'; inp.pattern='\\d*';
      inp.addEventListener('input', e => handleDigitInput(e, i));
      inp.addEventListener('keydown', e => handleKeyDown(e, i));
      codeBoxesDiv.appendChild(inp);
      digitInputs.push(inp);
    }
  }
  createCodeBoxes();

  function handleDigitInput(e, idx) {
    const v = e.target.value;
    if (v && /^\d$/.test(v)) {
      if (idx<5) digitInputs[idx+1].focus();
      verificationCode = digitInputs.map(i=>i.value).join('');
      verifyBtn.disabled = verificationCode.length !== 6;
      verifyBtn.classList.toggle('active', verificationCode.length === 6);
    } else {
      e.target.value = '';
      verificationCode = digitInputs.map(i=>i.value).join('');
      verifyBtn.disabled = true;
      verifyBtn.classList.remove('active');
    }
  }
  function handleKeyDown(e, idx) {
    if (e.key === 'Backspace' && !e.target.value && idx>0) {
      digitInputs[idx-1].focus();
      digitInputs[idx-1].value = '';
      verificationCode = digitInputs.map(i=>i.value).join('');
      verifyBtn.disabled = true;
      verifyBtn.classList.remove('active');
    }
  }
  function clearCodes() { digitInputs.forEach(i=>i.value=''); verificationCode=''; verifyBtn.disabled=true; verifyBtn.classList.remove('active'); }

  function resetSendMode() {
    sendBtn.classList.remove('hidden-btn','sending'); sendBtn.textContent='Send verification code'; sendBtn.disabled=true;
    resendBtn.classList.add('hidden-btn'); verifyBtn.classList.add('hidden-btn'); verifyBtn.disabled=true;
    digitInputs.forEach(i=>i.disabled=true); clearCodes(); document.getElementById('verificationMessage').style.display='none';
  }

  function switchToVerifyMode() {
    sendBtn.classList.add('hidden-btn'); resendBtn.classList.remove('hidden-btn'); resendBtn.disabled=false;
    verifyBtn.classList.remove('hidden-btn'); verifyBtn.disabled=true; verifyBtn.classList.remove('active');
    digitInputs.forEach(i=>i.disabled=false); digitInputs[0].focus();
  }

  document.getElementById('email').addEventListener('input', () => {
    currentEmail = document.getElementById('email').value.trim();

    document.getElementById('paypalButton').disabled = true;
    document.getElementById('payfastButton').disabled = true;
    updateShippingVisibility();
    sendBtn.disabled = !(currentEmail && currentEmail.includes('@'));
    sendBtn.classList.toggle('active', !sendBtn.disabled);
  });

  async function requestCode() {
    if (!currentEmail) return;
    resendBtn.classList.add('hidden-btn'); verifyBtn.classList.add('hidden-btn');
    sendBtn.classList.remove('hidden-btn'); sendBtn.textContent = 'Sending verification code...';
    sendBtn.disabled = true; sendBtn.classList.add('sending');
    try {
      await apiCall('sendVerificationCode', { email: currentEmail });
      sendBtn.classList.remove('sending'); sendBtn.classList.add('hidden-btn');
      switchToVerifyMode();
      document.getElementById('verificationMessage').style.display = 'block';
    } catch(e) {
      sendBtn.classList.remove('sending');
      alert('Error sending code');
      resetSendMode();
    }
  }

  sendBtn.addEventListener('click', requestCode);
  resendBtn.addEventListener('click', requestCode);

  verifyBtn.addEventListener('click', async () => {
    if (verificationCode.length !== 6) return;
    resendBtn.classList.add('hidden-btn');
    verifyBtn.textContent = 'Verifying email...';
    verifyBtn.disabled = true; verifyBtn.classList.add('sending');
    try {
      const result = await apiCall('verifyCode', { email: currentEmail, code: verificationCode });
      verifyBtn.classList.remove('sending');
      if (result) {
        emailVerified = true;
        document.getElementById('verificationContainer').style.display = 'none';
        document.getElementById('verificationMessage').style.display = 'none';
        document.getElementById('emailVerifiedBadge').style.display = 'inline-block';
        document.getElementById('productSelectionContainer').style.display = 'block';
        document.getElementById('paypalButton').disabled = false;
        document.getElementById('payfastButton').disabled = false;
        updateShippingVisibility();
      } else {
        alert('Invalid code. Try again.');
        clearCodes(); digitInputs.forEach(i=>i.disabled=false); digitInputs[0].focus();
        verifyBtn.textContent = 'Verify'; verifyBtn.disabled = true; verifyBtn.classList.remove('active');

      }
    } catch(e) { verifyBtn.classList.remove('sending'); }
  });

  // ========== GOOGLE PLACES ==========
  const googleMapsApiKey = allData?.brandSettings?.GoogleMapsApiKey || '';
  if (googleMapsApiKey) {
    function initAutocomplete() {
      const input = document.getElementById('addressLine1');

      const autocomplete = new google.maps.places.Autocomplete(input, {types:['address']});
      autocomplete.setFields(['address_components','formatted_address']);

        ['addressLine1','addressLine2','suburb','city','postalCode'].forEach(id => document.getElementById(id).value = '');
        const getComp = t => { for(let c of place.address_components) if(c.types.includes(t)) return c.long_name; return ''; };

        document.getElementById('addressLine2').value = getComp('subpremise');

        document.getElementById('city').value = getComp('locality') || getComp('administrative_area_level_1');
        document.getElementById('postalCode').value = getComp('postal_code');
        const country = getComp('country');
        if (country) {
          const sel = document.getElementById('countrySelect');
          for (let j=0; j<sel.options.length; j++) {

          }

    window.addEventListener('load', () => {
      const script = document.createElement('script');
      script.src = `https://maps.googleapis.com/maps/api/js?key=${googleMapsApiKey}&libraries=places`;
      script.async = true; script.defer = true;
      script.onload = () => {
        document.getElementById('useLocationBtn')?.addEventListener('click', () => {
          navigator.geolocation.getCurrentPosition(pos => {
            const geocoder = new google.maps.Geocoder();
            geocoder.geocode({location:{lat:pos.coords.latitude, lng:pos.coords.longitude}}, (results, status) => {
              if (status==='OK' && results[0]) {

                document.getElementById('addressLine1').value = (getComp('street_number')+' '+getComp('route')).trim();

      };

  }

  // ========== CALCULATE SHIPPING ==========
  function calculateShipping(locName, qty) {
    if (!locName || qty<=0) return 0;
    const loc = allData.shippingLocations.find(l=>l.name===locName);
    if (!loc?.region) return 0;
    const product = productMap[getSelectedProductType()];
    if (!product) return 0;
    const weight = (product.weight||0)*qty;
    const rates = allData.regionRates.filter(r=>r.region===loc.region).sort((a,b)=>a.maxWeight-b.maxWeight);
    if (!rates.length) return 0;
    for (let r of rates) if (weight <= r.maxWeight) return r.cost;
    return rates[rates.length-1].cost;
  }

    const sel = document.getElementById('countrySelect');
    sel.innerHTML = '<option value="">-- Select --</option>';

      opt.value = loc.name; opt.textContent = loc.name;
      sel.appendChild(opt);
    });
  }

  function updatePriceDisplay() {
    const type = getSelectedProductType(), product = type ? productMap[type] : null;
    const paymentSec = document.getElementById('paymentSection');

      ['unitPriceDisplay','discountDisplay','totalBeforeShippingDisplay','shippingCostDisplay','finalTotalDisplay'].forEach(id => document.getElementById(id).textContent='–');
      paymentSec.style.display = 'none'; return;
    }
    const qty = parseInt(document.getElementById('quantity').value,10)||1, rate = allData.rates[selectedCurrency]||1;
    const unit = product.basePrice*rate;
    let discAmt = 0;
    if (qty >= (product.discountThreshold||5)) discAmt = unit*qty*(product.discountPercent||10)/100;
    const subtotal = unit*qty - discAmt;
    let shipping = 0;
    if (type==='Physical') { const loc = document.getElementById('countrySelect').value; if (loc) shipping = calculateShipping(loc, qty)*rate; }
    const total = subtotal+shipping;
    document.getElementById('unitPriceDisplay').textContent = formatCurrency(unit, selectedCurrency);
    document.getElementById('discountDisplay').textContent = discAmt>0 ? formatCurrency(discAmt, selectedCurrency) : 'None';
    document.getElementById('totalBeforeShippingDisplay').textContent = formatCurrency(subtotal, selectedCurrency);
    document.getElementById('shippingCostDisplay').textContent = (shipping>0 || type==='Physical') ? formatCurrency(shipping, selectedCurrency) : 'Free';
    document.getElementById('finalTotalDisplay').textContent = formatCurrency(total, selectedCurrency);
    paymentSec.style.display = total>0 ? 'block' : 'none';
  }

  // ========== PAYMENT ==========
  async function handlePayment(gateway) {
    if (!document.getElementById('customerName').value.trim()) { alert('Please fill in your name.'); return; }
    if (!emailVerified) { alert('Please verify your email.'); return; }
    if (!getSelectedProductType()) { alert('Please select a book format.'); return; }
    const orderData = buildOrderData();
    if (!orderData) return;
    if (!confirm('Please confirm your order.')) return;
    const btn = gateway==='paypal' ? document.getElementById('paypalButton') : document.getElementById('payfastButton');
    btn.disabled = true; btn.textContent = 'Saving…';
    const action = gateway==='paypal' ? 'saveOrderAndGetPaypalUrl' : 'saveOrderAndGetPayfastUrl';
    const result = await apiCall(action, { orderData });
    btn.disabled = false;
    document.getElementById('paypalButton').style.display = 'none';
    document.getElementById('payfastButton').style.display = 'none';
    const c = document.getElementById('paymentLinkContainer');
    const url = gateway==='paypal' ? result.paypalUrl : result.payfastUrl;
    c.innerHTML = `<p>Order saved.</p><a href="${url}" target="_blank">Complete payment on ${gateway==='paypal'?'PayPal':'Payfast'}</a>`;
    c.style.display = 'block';
  }

  function buildOrderData() {
    const name = document.getElementById('customerName').value.trim(), email = document.getElementById('email').value.trim();
    const type = getSelectedProductType(), product = type ? productMap[type] : null;
    if (!product) return null;
    const qty = parseInt(document.getElementById('quantity').value,10)||1, rate = allData.rates[selectedCurrency]||1;
    const unit = product.basePrice*rate;
    let discAmt = 0;
    if (qty >= (product.discountThreshold||5)) discAmt = unit*qty*(product.discountPercent||10)/100;
    const subtotal = unit*qty - discAmt;
    let shippingCost = 0, shippingAddr = '';
    const phone = document.getElementById('orderPhoneCountrySelect').value + ' ' + document.getElementById('orderPhoneNumber').value.trim();
    if (type==='Physical') {
      const a1 = document.getElementById('addressLine1').value.trim(), a2 = document.getElementById('addressLine2').value.trim();
      const suburb = document.getElementById('suburb').value.trim(), city = document.getElementById('city').value.trim();
      const postal = document.getElementById('postalCode').value.trim(), loc = document.getElementById('countrySelect').value;
      const notes = document.getElementById('shippingNotes').value.trim();
      shippingAddr = [a1,a2,suburb,city,postal,loc, notes?('(notes: '+notes+')'):''].filter(Boolean).join(', ');
      shippingCost = calculateShipping(loc, qty)*rate;
    }
    const total = subtotal+shippingCost;
    return { customerName:name, email, phone, productId:product.id, productName:product.name, type, quantity:qty,
      unitPrice:unit, discountPercent:product.discountPercent||10, discountAmount:discAmt, subtotal, shippingCost, total, currency:selectedCurrency, shippingAddress:shippingAddr };
  }

  document.getElementById('paypalButton').addEventListener('click', () => handlePayment('paypal'));

  document.getElementById('contactSendBtn').addEventListener('click', async () => {
    const name = document.getElementById('contactName').value.trim(), email = document.getElementById('contactEmail').value.trim();
    const phone = document.getElementById('contactPhoneCountrySelect').value + ' ' + document.getElementById('contactPhone').value.trim();
    const message = document.getElementById('contactMessage').value.trim();
    if (!name || !email || !message) { alert('Please fill in all required fields.'); return; }
    const btn = document.getElementById('contactSendBtn');
    btn.disabled = true; btn.textContent = 'Sending…';
    const result = await apiCall('sendContactMessage', { name, email, phone, message });
    btn.disabled = false; btn.textContent = 'Send Message';
    if (result.success) {
      alert('Message sent!');
      document.getElementById('contactName').value = ''; document.getElementById('contactEmail').value = ''; document.getElementById('contactPhone').value = ''; document.getElementById('contactMessage').value = '';
    } else alert('Error: ' + result.error);
  });

  // ========== ICONS ==========
  document.getElementById('homeIconLink').addEventListener('click', e => { e.preventDefault(); navigateTo('home'); });
  document.getElementById('aboutIconLink').addEventListener('click', e => { e.preventDefault(); navigateTo('about'); });
  document.getElementById('contactIconLink').addEventListener('click', e => { e.preventDefault(); navigateTo('contact'); });

  // ========== STARTUP ==========
  init();
</script>
</body>
</html>
